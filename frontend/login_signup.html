<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iReport | Login & Sign Up</title>
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: flex-end; /* Aligns content to the right */
      align-items: center;
      padding-right: 50px; /* Space on the left side */
       /* Background image */
      background-image: url("{{ url_for('static', filename='background.png') }}");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

     /* Optional dark overlay for readability */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 40px;
      width: 350px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    h2 { color: #60a5fa; margin-bottom: 20px; }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 15px;
    }

    input::placeholder { color: #a5b4fc; }

    input:focus {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid #60a5fa;
    }

    button {
      background: #2563eb;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover { background: #3b82f6; }

    .toggle-text { margin-top: 15px; font-size: 14px; color:#fbfbfc; }

    .toggle-text a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
    }

    .toggle-text a:hover { text-decoration: underline; }

    .fade { animation: fadeIn 0.6s ease-in-out; }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  {% if mode == 'login' %}
  <div class="container fade">
    <h2>Login to iReport</h2>
    <form method="POST">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <div class="toggle-text">
      Don’t have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
    </div>
  </div>

  {% else %}
  <div class="container fade">
    <h2>Create Account</h2>
    <form method="POST">
      <input type="text" name="name" placeholder="Full Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <div class="toggle-text">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
  {% endif %}
</body>
</html>
