<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iReport - Your Cybercrime Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/chatbot.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;                  
      display: flex;
      justify-content: center;            
      align-items: center;                
      background: url('./assets/images/background.png') no-repeat center center fixed;
  background-size: cover;
      font-family: Arial, sans-serif;
    }

    .container {
    
      text-align: center;
      max-width: 900px;
      width: 95%;
      background: rgba(0, 0, 0, 0.6);     
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      color: #e9dedef6;
    }

    .chart-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #4caf50;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: 0.3s;
    }
    .chart-btn:hover { background: #45a049; }
    
.modal {
  display: none;
  position: fixed;
  z-index: 1000;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.7);
  justify-content: center;
  align-items: center;
}
.modal-content {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  width: 90%;
  max-width: 600px;             
  color: #fff;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

#casesChart {
  width: 80vw;                  
  height: 50vw;                 
  max-width: 800px;             
  max-height: 500px;
}
@media (max-width: 600px) {
  #casesChart {
    width: 90vw;                
    height: 60vw;
    max-height: 250px;
  }
  .modal-content {
    padding: 15px;
  }
}

.close {
  position: absolute;
  top: 10px; right: 15px;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
}

  </style>
</head>
<body>

<main class="container">
  <header>
    <h1>iReport - Your Cybercrime Assistant</h1>
    <p class="subtitle">Stay safe, stay informed.</p>
    <button class="chart-btn" onclick="openChart()">📊 Case Live Chart</button>
  </header>

  <section class="menu" aria-label="Main Menu">
    <div class="menu-item" data-page="complaint">
      <img src="assets/icons/complaint.png" alt="File Complaint">
      <p>File Complaint</p>
    </div>
    <div class="menu-item" data-page="learning">
      <img src="assets/icons/educator.png" alt="Learning Space">
      <p>Learning Space</p>
    </div>
    <div class="menu-item" data-page="suspect">
      <img src="assets/icons/suspect.png" alt="Check Suspect">
      <p>Check Suspect</p>
    </div>
    <div class="menu-item" data-page="volunteer">
      <img src="assets/icons/volunteer.png" alt="Volunteer">
      <p>Volunteer</p>
    </div>
    <div class="menu-item" data-page="puzzle">
      <img src="assets/icons/puzzle.png" alt="Puzzle Game">
      <p>Puzzle</p>
    </div>
    <div class="menu-item" data-page="sos">
      <img src="assets/icons/sos.png" alt="SOS">
      <p>SOS</p>
    </div>
    <div class="menu-item" data-page="phishing">
      <img src="assets/icons/phishing.png" alt="Check Phishing">
      <p>Check Phishing</p>
    </div>
    <div class="menu-item" data-page="malware">
      <img src="assets/icons/malware.png" alt="Check Malware">
      <p>Check Malware</p>
    </div>
   <div class="menu-item" data-page="talktous">
  <img src="assets/icons/talk to us.png" alt="Talk to Us">
  <p>Talk to Us</p>
</div>
  </section>

  <footer>
    <a href="#" aria-label="Instagram"><img src="assets/icons/instagram.png" alt="Instagram"></a>
    <a href="#" aria-label="Twitter"><img src="assets/icons/twitter.png" alt="Twitter"></a>
    <a href="#" aria-label="Facebook"><img src="assets/icons/facebook.png" alt="Facebook"></a>
  </footer>
  <!-- Chart Modal -->
  <div class="modal" id="chartModal">
    <div class="modal-content">
      <span class="close" onclick="closeChart()">&times;</span>
      <h2>Cases Submitted (Last 30 Days)</h2>
      <canvas id="casesChart"></canvas>
    </div>
  </div>

  <!-- chat container inside main so it appears centered -->
  <div id="chat-container"></div>
</main>

<script src="assets/chatbot.js"></script>
<script>
  fetch("assets/chatbot.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("chat-container").innerHTML = data;
      if (typeof initChat === "function") 
        initChat();
      }
    );

  document.querySelectorAll('.menu-item').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      const pages = {
        complaint: 'complaint.html',
        learning: 'learning.html',
        suspect: 'suspect.html',
        volunteer: 'volunteer.html',
        puzzle: 'puzzle.html',
        sos: 'sos.html',
        phishing: 'phishing.html',
        malware: 'malware.html',
        talktous: 'talktous.html'
      };
      if (pages[page]) {
        window.location.href = pages[page];
      } else {
        alert('Page not found!');
      }
    });
  });

  let chartInstance;
  function openChart() {
    document.getElementById("chartModal").style.display = "flex";
    if (!chartInstance) {
      const ctx = document.getElementById('casesChart').getContext('2d');
      const labels = Array.from({length: 30}, (_, i) => `Day ${i+1}`);
      const data = Array.from({length: 30}, () => Math.floor(Math.random()*20)+1);
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Cases',
            data: data,
            borderColor: 'rgba(54, 162, 235, 1)',
            backgroundColor: 'rgba(54, 162, 235, 0.3)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#fff' } } },
          scales: {
            x: { ticks: { color: '#fff' } },
            y: { ticks: { color: '#fff' }, beginAtZero: true }
          }
        }
      });
    }
  }
  function closeChart() {
    document.getElementById("chartModal").style.display = "none";
  }
  
window.onclick = function(event) {
  const chartModal = document.getElementById("chartModal");
  if (event.target === chartModal) {
    closeChart();
  }
};

</script>

</body>
</html>
