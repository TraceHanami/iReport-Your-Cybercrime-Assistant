<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="iReport - Your trusted cybercrime reporting and education platform">
  <meta name="keywords" content="cybercrime, report, phishing, malware, cyber security, online safety">
  <meta name="author" content="iReport Team">
  <title>iReport - Your Cybercrime Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="assets/chatbot.css">
  <link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: url('./assets/images/background.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      transition: background-color 0.3s ease;
      overflow-x: hidden;
      position: relative;
    }

    body.dark-mode {
      background-color: #121212;
    }

    .container {
      text-align: center;
      max-width: 900px;
      width: 95%;
      background: rgba(255, 255, 255, 0.15);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      color: #e9dedef6;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      position: relative;
      z-index: 1;
    }

    .container.visible {
      opacity: 1;
      transform: translateY(0);
    }

    body.dark-mode .container {
      background: rgba(30, 30, 30, 0.8);
      color: #f5f5f5;
    }

    .loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .loader {
      border: 5px solid #f3f3f3;
      border-top: 5px solid #4caf50;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    .menu-item {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
    }

    .menu-item:hover {
      transform: scale(1.05) translateY(-5px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
    }

    .chart-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #4caf50;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: 0.3s;
      z-index: 10;
    }

    .chart-btn:hover { background: #45a049; }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #222;
      padding: 20px;
      border-radius: 10px;
      width: 90%;
      max-width: 600px;
      color: #fff;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #casesChart {
      width: 80vw;
      height: 50vw;
      max-width: 800px;
      max-height: 500px;
    }

    .close {
      position: absolute;
      top: 10px; right: 15px;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    .language-selector {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 100;
    }

    .language-selector select {
      padding: 8px 12px;
      border-radius: 50px;
      background-color: rgba(255, 255, 255, 0.2);
      color: rgb(21, 18, 18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      font-size: 14px;
      outline: none;
    }

    .language-selector select:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    .theme-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 200;
      background: #7e57c2;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .theme-toggle:hover {
      background: #673ab7;
    }

    .theme-toggle:focus,
    .language-selector select:focus,
    .chart-btn:focus {
      outline: 3px solid rgba(255,255,255,0.25);
      outline-offset: 2px;
    }

    #title {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 2px solid #4caf50;
      animation: typing 3s steps(30) 1, blink 0.7s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    @media (max-width: 600px) {
      #casesChart {
        width: 90vw;
        height: 60vw;
        max-height: 250px;
      }
      .modal-content {
        padding: 15px;
      }

      .language-selector,
      .theme-toggle,
      .chart-btn {
        position: relative;
        top: 0;
        right: 0;
        left: 0;
        margin: 5px auto;
        display: inline-block;
      }

      header {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    }

    #particles-js {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
  </style>
</head>
<body>
  <div id="particles-js"></div>

  <div class="loader-container" id="loader">
    <div class="loader"></div>
  </div>

  <div class="language-selector">
    <select id="languageSelect" aria-label="Select language">
      <option value="en">English</option>
      <option value="hi">हिन्दी (Hindi)</option>
      <option value="ta">தமிழ் (Tamil)</option>

      <option value="gu">ગુજરાતી (Gujarati)</option>

      <option value="ur">اردو (Urdu)</option>
      <option value="as">অসমীয়া (Assamese)</option>
    </select>
  </div>

  <main class="container">
    <header>
      <h1 id="title">iReport - Your Cybercrime Assistant</h1>
      <p class="subtitle" id="subtitle">Stay safe, stay informed.</p>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">🌓 Toggle Theme</button>
    </header>

    <section class="menu" aria-label="Main Menu">
      <div class="menu-item" data-page="complaint">
        <img src="assets/icons/complaint.png" alt="File Complaint">
        <p id="complaint">File Complaint</p>
      </div>
      <div class="menu-item" data-page="learning">
        <img src="assets/icons/educator.png" alt="Learning Space">
        <p id="learning">Learning Space</p>
      </div>
      <div class="menu-item" data-page="suspect">
        <img src="assets/icons/suspect.png" alt="Check Suspect">
        <p id="suspect">Check Suspect</p>
      </div>
      <div class="menu-item" data-page="volunteer">
        <img src="assets/icons/volunteer.png" alt="Volunteer">
        <p id="volunteer">Volunteer</p>
      </div>
      <div class="menu-item" data-page="puzzle">
        <img src="assets/icons/puzzle.png" alt="Puzzle Game">
        <p id="puzzle">Puzzle</p>
      </div>
      <div class="menu-item" data-page="sos">
        <img src="assets/icons/sos.png" alt="SOS">
        <p id="sos">SOS</p>
      </div>
      <div class="menu-item" data-page="phishing">
        <img src="assets/icons/phishing.png" alt="Check Phishing">
        <p id="phishing">Check Phishing</p>
      </div>
      <div class="menu-item" data-page="malware">
        <img src="assets/icons/malware.png" alt="Check Malware">
        <p id="malware">Check Malware</p>
      </div>
      <div class="menu-item" data-page="talktous">
        <img src="assets/icons/talk to us.png" alt="Talk to Us">
        <p id="talktous">Talk to Us</p>
      </div>
    </section>

    <footer>
      <a href="#" aria-label="Instagram"><img src="assets/icons/instagram.png" alt="Instagram"></a>
      <a href="#" aria-label="Twitter"><img src="assets/icons/twitter.png" alt="Twitter"></a>
      <a href="#" aria-label="Facebook"><img src="assets/icons/facebook.png" alt="Facebook"></a>
    </footer>

    <div class="modal" id="chartModal">
      <div class="modal-content">
        <span class="close" onclick="closeChart()" aria-label="Close chart">&times;</span>
        <h2>Cases Submitted (Last 30 Days)</h2>
        <canvas id="casesChart"></canvas>
      </div>
    </div>
  </main>

<script>
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    document.getElementById('loader').classList.add('hidden');
    document.querySelector('.container').classList.add('visible');
  }, 1000);
});

// Menu navigation
document.querySelectorAll('.menu-item').forEach(item => {
  item.addEventListener('click', () => {
    const page = item.dataset.page;
    const pages = {
      complaint: 'complaint.html',
      learning: 'learning.html',
      suspect: 'suspect.html',
      volunteer: 'volunteer.html',
      puzzle: 'puzzle.html',
      sos: 'sos.html',
      phishing: 'phishing.html',
      malware: 'malware.html',
      talktous: 'talktous.html'
    };
    if (pages[page]) window.location.href = pages[page];
    else alert('Page not found!');
  });
});

// Chart modal
function openChart() { document.getElementById('chartModal').style.display='flex'; initChart(); }
function closeChart() { document.getElementById('chartModal').style.display='none'; }

function initChart() {
  const ctx = document.getElementById('casesChart').getContext('2d');
  const labels = Array.from({length: 30}, (_, i) => `Day ${i+1}`);
  const data = Array.from({length: 30}, () => Math.floor(Math.random()*50));
  new Chart(ctx, {
    type: 'line',
    data: { labels: labels, datasets: [{label:'Reported Cases',data:data,borderColor:'#4caf50',backgroundColor:'rgba(76,175,80,0.1)',tension:0.4,fill:true}]},
    options: {responsive:true, maintainAspectRatio:false, animation:{easing:'easeOutQuart', duration:1000}, scales:{y:{beginAtZero:true, ticks:{color:'#fff'}, grid:{color:'rgba(255,255,255,0.1)'}}, x:{ticks:{color:'#fff'}, grid:{color:'rgba(255,255,255,0.1)'}}}}
  });
}

// Theme toggle
const themeToggle = document.getElementById('themeToggle');
const savedDark = localStorage.getItem('darkMode') === 'true';
if(savedDark) { document.body.classList.add('dark-mode'); themeToggle.setAttribute('aria-pressed','true'); }
else themeToggle.setAttribute('aria-pressed','false');
themeToggle.addEventListener('click', () => {
  const isDark = document.body.classList.toggle('dark-mode');
  themeToggle.setAttribute('aria-pressed', String(isDark));
  localStorage.setItem('darkMode', isDark);
});

const langSelect = document.getElementById("languageSelect");
langSelect.addEventListener("change", () => {
  const lang = langSelect.value;
  if(translations[lang]) {
    Object.keys(translations[lang]).forEach(key => {
      const el = document.getElementById(key);
      if(el) el.textContent = translations[lang][key];
    });
  }
});
