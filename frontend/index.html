  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;

      background: url('./assets/images/background.png') no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      color: #e9dedef6;
    }
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      max-width: 900px;
      width: 95%;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      min-height: 80vh;
    }
    .chart-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #4caf50;
      border: none;
      padding: 10px 15px;
      border-radius: 50px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      transition: 0.3s;
    }
    .chart-btn:hover { background: #45a049; }
.side-panel {
  width: 260px;
  height: 100vh;        /* full viewport height */
  overflow-y: auto;     /* manual scroll */
  background: url('./assets/images/background.png') no-repeat center center fixed;
  background-size: cover;
  color: #fff;
  padding: 15px;
  position: fixed;      /* <-- key to detach from center */
  top: 0;
  z-index: 1000;
}

.left-panel {
  left: 0;              /* sticks to left */
  border-right: 2px solid #333;
}

.right-panel {
  right: 0;             /* sticks to right */
  border-left: 2px solid #333;
}

/* Push the main container away from both panels */
main.container {
  margin: 0 260px;      /* leaves space for side panels */
}

.scroll-content {
  display: flex;
  flex-direction: column;
  gap: 20px;
  animation: none !important;
}


    .topic {
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      padding: 10px;
      border-bottom: 1px solid #444;
      transition: 0.3s;
    }
    .topic:hover {
      color: #4caf50;
      text-decoration: underline;
    }

    @keyframes scroll-up {
      0% { transform: translateY(100%); }
      100% { transform: translateY(-100%); }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 2000;
    }
    .modal-content {
      background: #111;
      padding: 20px;
      border-radius: 12px;
      width: 80%;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      color: #ddd;
      text-align: left;
      font-size: 15px;
      line-height: 1.6;
    }
    .modal-content h2 { margin-top: 0; color: #4caf50; }
    .close {
      float: right;
      font-size: 22px;
      cursor: pointer;
      color: #fff;
    }
    .modal-content img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 12px;
    }
  </style>
</head>

  // Open article with image support
  function openArticle(key) {
    document.getElementById("articleTitle").innerText = articles[key].title;
    document.getElementById("articleBody").innerHTML = `
      <img src="${articles[key].image}" alt="${articles[key].title}">
      <p>${articles[key].body}</p>
    `;
    document.getElementById("articleModal").style.display = "flex";
  }
  function closeArticle() {
    document.getElementById("articleModal").style.display = "none";
  }

  // Chart
  let chartInstance;
  function openChart() {
    document.getElementById("chartModal").style.display = "flex";
    if (!chartInstance) {
      const ctx = document.getElementById('casesChart').getContext('2d');
      const labels = Array.from({length: 30}, (_, i) => `Day ${i+1}`);
      const data = Array.from({length: 30}, () => Math.floor(Math.random()*20)+1);
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Cases',
            data: data,
            borderColor: 'rgba(54, 162, 235, 1)',
            backgroundColor: 'rgba(54, 162, 235, 0.3)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#fff' } } },
          scales: {
            x: { ticks: { color: '#fff' } },
            y: { ticks: { color: '#fff' }, beginAtZero: true }
          }
        }
      });
    }
  }
  function closeChart() {
    document.getElementById("chartModal").style.display = "none";
  }
  window.onclick = function(event) {
    const articleModal = document.getElementById("articleModal");
    const chartModal = document.getElementById("chartModal");
    if (event.target === articleModal) {
      closeArticle();
    }
    if (event.target === chartModal) {
      closeChart();
    }
  };
