<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suspect Check & Case Tracker</title>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: url('./assets/images/background.png') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    padding-top: 50px;
}

.container {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    width: 450px;
    text-align: center;
}

/* Switch buttons */
.switch-buttons {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.switch-buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
}
.switch-buttons button:not(:last-child) {
    margin-right: 10px;
}
.switch-buttons button.active {
    background: #28a745;
}

input[type="text"] {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button.submit {
    padding: 10px 20px;
    border-radius: 5px;
    border: none;
    background-color: #007bff;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}
button:disabled {
    background-color: #555;
    cursor: not-allowed;
}

.result {
    font-weight: bold;
    margin-top: 15px;
    text-align: left;
}

canvas {
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #f9f9f9;
    margin-bottom: 10px;
}

.case-item {
    background: rgba(255,255,255,0.15);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
}
</style>
</head>
<body>
<div class="container">
    <div class="switch-buttons">
        <button id="suspectBtn" class="active" onclick="showForm('suspect')">Check Suspect</button>
        <button id="caseBtn" onclick="showForm('case')">Track Case</button>
    </div>

    <!-- Suspect Form -->
    <div id="suspectForm">
        <h2>Check Suspect Details</h2>
        <input type="text" id="aadhaar" placeholder="Enter Aadhaar Number"><br>
        <input type="text" id="name" placeholder="Enter Name with Initial"><br>

        <p>Letters CAPTCHA:</p>
        <canvas id="captchaCanvas1" width="220" height="80"></canvas>
        <br>
        <input type="text" id="captchaInput1" placeholder="Enter letters here">
        <button type="button" onclick="generateCaptcha('captchaCanvas1')">↻ Refresh</button>
        <button class="submit" onclick="submitForm()">Submit</button>
        <div class="result" id="result"></div>
    </div>

    <!-- Case Form -->
    <div id="caseForm" style="display:none;">
        <h2>📁 Track Case</h2>
        <input type="text" id="caseId" placeholder="Enter Case ID"><br>

        <p>Letters CAPTCHA:</p>
        <canvas id="captchaCanvas2" width="220" height="80"></canvas><br>
        <input type="text" id="captchaInput2" placeholder="Enter letters here">
        <button type="button" onclick="generateCaptcha('captchaCanvas2')">↻ Refresh</button>
        <button class="submit" onclick="trackCase()">Track Case</button>
        <div id="caseList"></div>
    </div>
</div>

<script>
// ---------- FORM SWITCH ----------
function showForm(type) {
    const suspectBtn = document.getElementById('suspectBtn');
    const caseBtn = document.getElementById('caseBtn');
    const suspectForm = document.getElementById('suspectForm');
    const caseForm = document.getElementById('caseForm');

    if (type === 'suspect') {
        suspectBtn.classList.add('active');
        caseBtn.classList.remove('active');
        suspectForm.style.display = 'block';
        caseForm.style.display = 'none';
    } else {
        caseBtn.classList.add('active');
        suspectBtn.classList.remove('active');
        caseForm.style.display = 'block';
        suspectForm.style.display = 'none';
    }
}

// ---------- CAPTCHA ----------
let captchaCodes = {};
function generateCaptcha(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let code = "";
    for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    captchaCodes[canvasId] = code;

    for (let i = 0; i < code.length; i++) {
        ctx.font = `${Math.floor(Math.random() * 10) + 32}px Arial`;
        ctx.fillStyle = `rgb(${Math.random()*150}, ${Math.random()*150}, ${Math.random()*150})`;
        const x = 20 + i * 30;
        const y = 40 + Math.random() * 20;
        const angle = (Math.random() - 0.5) * 0.5;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillText(code[i], 0, 0);
        ctx.restore();
    }

    for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.7)`;
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
    }

    for (let i = 0; i < 50; i++) {
        ctx.fillStyle = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.6)`;
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, 2*Math.PI);
        ctx.fill();
    }
}

// ---------- SUSPECT CHECK ----------
function submitForm() {
    const aadhaar = document.getElementById('aadhaar').value.trim();
    const name = document.getElementById('name').value.trim();
    const captchaInput = document.getElementById('captchaInput1').value.trim();
    const resultDiv = document.getElementById('result');

    if (!aadhaar || !name) {
        resultDiv.style.color = 'red';
        resultDiv.textContent = "Please fill Aadhaar and Name.";
        return;
    }

    if (captchaInput !== captchaCodes['captchaCanvas1']) {
        resultDiv.style.color = 'red';
        resultDiv.textContent = "CAPTCHA does not match. Try again.";
        generateCaptcha('captchaCanvas1');
        document.getElementById('captchaInput1').value = "";
        return;
    }

    fetch(`http://localhost:5000/api/reports`)
        .then(res => res.json())
        .then(data => {
            const found = data.find(r => r.aadhaar_id === aadhaar && r.reported_by.toLowerCase() === name.toLowerCase());
            if (found) {
                resultDiv.style.color = 'lightgreen';
                resultDiv.innerHTML = `
                    <p>✅ Suspect Found:</p>
                    <p><strong>Name:</strong> ${found.reported_by}</p>
                    <p><strong>Case Type:</strong> ${found.type}</p>
                    <p><strong>Priority:</strong> ${found.priority}</p>
                    <p><strong>Case Date:</strong> ${found.date}</p>
                `;
            } else {
                resultDiv.style.color = 'orange';
                resultDiv.textContent = "⚠️ No suspect found.";
            }
        })
        .catch(err => {
            resultDiv.style.color = 'red';
            resultDiv.textContent = "Error connecting to backend.";
            console.error(err);
        });
}

// ---------- CASE TRACKING ----------
function trackCase() {
    const caseId = document.getElementById('caseId').value.trim();
    const captchaInput = document.getElementById('captchaInput2').value.trim();
    const caseListDiv = document.getElementById('caseList');

    if (!caseId) {
        caseListDiv.innerHTML = "<p>Please enter a Case ID.</p>";
        return;
    }

    if (captchaInput !== captchaCodes['captchaCanvas2']) {
        caseListDiv.innerHTML = "<p>CAPTCHA does not match. Try again.</p>";
        generateCaptcha('captchaCanvas2');
        document.getElementById('captchaInput2').value = "";
        return;
    }

    fetch(`http://localhost:5000/api/reports`)
        .then(res => res.json())
        .then(data => {
            const found = data.find(r => r.case_id == caseId);
            if (found) {
                caseListDiv.innerHTML = `
                    <div class="case-item">
                        <strong>Case ID:</strong> ${found.case_id}<br>
                        <strong>Type:</strong> ${found.type}<br>
                        <strong>Reported By:</strong> ${found.reported_by}<br>
                        <strong>Date:</strong> ${found.date}<br>
                        <strong>Priority:</strong> ${found.priority}
                    </div>
                `;
            } else {
                caseListDiv.innerHTML = "<p>No case found with that ID.</p>";
            }
        })
        .catch(err => {
            caseListDiv.innerHTML = "<p>Error connecting to backend.</p>";
            console.error(err);
        });
}

// Initialize CAPTCHAs
generateCaptcha('captchaCanvas1');
generateCaptcha('captchaCanvas2');
</script>
</body>
</html>
