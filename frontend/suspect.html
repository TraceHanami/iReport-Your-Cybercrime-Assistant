<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suspect Check with CAPTCHA</title>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: url('./assets/images/background.png') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    padding-top: 50px;
}
.container {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    width: 450px;
    text-align: center;
}
input[type="text"] {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}
button {
    padding: 10px 20px;
    border-radius: 5px;
    border: none;
    background-color: #007bff;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}
button:disabled {
    background-color: #555;
    cursor: not-allowed;
}
.result {
    font-weight: bold;
    margin-top: 15px;
    text-align: left;
}
/* --- CAPTCHA STYLE --- */
canvas {
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #f9f9f9;
    margin-bottom: 10px;
}
</style>
</head>
<body>
<div class="container">
    <h2>Check Suspect Details</h2>
    <input type="text" id="aadhaar" placeholder="Enter Aadhaar Number"><br>
    <input type="text" id="name" placeholder="Enter Name with Initial"><br>

    <p>Letters CAPTCHA:</p>
    <canvas id="captchaCanvas" width="220" height="80"></canvas>
    <br>
    <input type="text" id="captchaInput" placeholder="Enter letters here">
    <button type="button" onclick="generateCaptcha()">↻ Refresh</button>

    <button id="submitBtn" onclick="submitForm()">Submit</button>
    <div class="result" id="result"></div>
</div>

<script>
// ---------- CAPTCHA ----------
let captchaCode = "";

function generateCaptcha() {
    const canvas = document.getElementById("captchaCanvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Background
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    captchaCode = "";
    for (let i = 0; i < 6; i++) {
        captchaCode += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    // Draw text
    for (let i = 0; i < captchaCode.length; i++) {
        ctx.font = `${Math.floor(Math.random() * 10) + 32}px Arial`;
        ctx.fillStyle = `rgb(${Math.random()*150}, ${Math.random()*150}, ${Math.random()*150})`;
        const x = 20 + i * 30;
        const y = 40 + Math.random() * 20;
        const angle = (Math.random() - 0.5) * 0.5;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillText(captchaCode[i], 0, 0);
        ctx.restore();
    }

    // Distortion lines
    for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.7)`;
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
    }

    // Noise dots
    for (let i = 0; i < 50; i++) {
        ctx.fillStyle = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.6)`;
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, 2*Math.PI);
        ctx.fill();
    }
}

// ---------- SUSPECT DATABASE ----------
const suspects = [
    { 
        aadhaar: "1234 5678 9012", 
        name: "R. Sharma", 
        state: "Maharashtra", 
        district: "Pune", 
        village: "Hinjewadi", 
        phone: "9876543210", 
        family: [
            { member: "Wife - S. Sharma", phone: "9988776655" },
            { member: "Son - A. Sharma", phone: "8877665544" }
        ] 
    },
    { 
        aadhaar: "2345 6789 0123", 
        name: "P. Verma", 
        state: "Uttar Pradesh", 
        district: "Lucknow", 
        village: "Aliganj", 
        phone: "8765432109", 
        family: [
            { member: "Father - V. Verma", phone: "7766554433" },
            { member: "Mother - R. Verma", phone: "6655443322" }
        ] 
    }
];

// ---------- FORM SUBMIT ----------
function submitForm() {
    const aadhaar = document.getElementById('aadhaar').value.trim();
    const name = document.getElementById('name').value.trim();
    const captchaInput = document.getElementById('captchaInput').value.trim();
    const resultDiv = document.getElementById('result');

    if (!aadhaar || !name) {
        resultDiv.style.color = 'red';
        resultDiv.textContent = "Please fill Aadhaar and Name.";
        return;
    }

    if (captchaInput !== captchaCode) {
        resultDiv.style.color = 'red';
        resultDiv.textContent = "CAPTCHA does not match. Try again.";
        generateCaptcha();
        document.getElementById('captchaInput').value = "";
        return;
    }

    const found = suspects.find(s => 
        s.aadhaar === aadhaar &&
        s.name.toLowerCase() === name.toLowerCase()
    );

    if (found) {
        let familyDetails = "<ul>";
        found.family.forEach(f => {
            familyDetails += `<li><strong>${f.member}:</strong> ${f.phone}</li>`;
        });
        familyDetails += "</ul>";

        resultDiv.style.color = 'lightgreen';
        resultDiv.innerHTML = `
            <p>✅ Suspect Found:</p>
            <p><strong>Aadhaar:</strong> ${found.aadhaar}</p>
            <p><strong>Name:</strong> ${found.name}</p>
            <p><strong>State:</strong> ${found.state}</p>
            <p><strong>District:</strong> ${found.district}</p>
            <p><strong>Village:</strong> ${found.village}</p>
            <p><strong>Phone:</strong> ${found.phone}</p>
            <p><strong>Family Members:</strong></p>
            ${familyDetails}
        `;
    } else {
        resultDiv.style.color = 'orange';
        resultDiv.textContent = "⚠️ No suspect found.";
    }
}

// Initialize CAPTCHA
generateCaptcha();
</script>
</body>
</html>
