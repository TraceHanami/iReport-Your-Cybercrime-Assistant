<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suspect Check & Case Tracker</title>
<style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: url('./assets/images/background.png') no-repeat center center fixed;
    background-size: cover;
    color: #ffffff;
    padding-top: 50px;
}

.container {
    background: rgba(0,0,0,0.6);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    width: 450px;
    text-align: center;
}

/* Switch buttons */
.switch-buttons {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.switch-buttons button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #007bff;
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
}
.switch-buttons button:not(:last-child) {
    margin-right: 10px;
}
.switch-buttons button.active {
    background: #28a745;
}

input[type="text"] {
    width: 90%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
    border: 1px solid #ccc;
}

button.submit {
    padding: 10px 20px;
    border-radius: 5px;
    border: none;
    background-color: #007bff;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}
button:disabled {
    background-color: #555;
    cursor: not-allowed;
}

.result {
    font-weight: bold;
    margin-top: 15px;
    text-align: left;
}

canvas {
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #f9f9f9;
    margin-bottom: 10px;
}

.case-item {
    background: rgba(255,255,255,0.15);
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
}
</style>
</head>
<body>
<div class="container">
    <div class="switch-buttons">
        <button id="suspectBtn" class="active" onclick="showForm('suspect')">Check Suspect</button>
        <button id="caseBtn" onclick="showForm('case')">Track Case</button>
    </div>

    <!-- Suspect Form -->
    <div id="suspectForm">
        <h2>Check Suspect Details</h2>
        <input type="text" id="aadhaar" placeholder="Enter Aadhaar Number"><br>
        <input type="text" id="name" placeholder="Enter Name with Initial"><br>

        <p>Letters CAPTCHA:</p>
        <canvas id="captchaCanvas1" width="220" height="80"></canvas>
        <br>
        <input type="text" id="captchaInput1" placeholder="Enter letters here">
        <button type="button" onclick="generateCaptcha('captchaCanvas1')">↻ Refresh</button>
        <button class="submit" onclick="submitForm()">Submit</button>
        <div class="result" id="result"></div>
    </div>

    <!-- Case Form -->
    <div id="caseForm" style="display:none;">
        <h2>📁 Track or Add Case</h2>
        <input type="text" id="caseId" placeholder="Enter Case ID"><br>
        <input type="text" id="caseStatus" placeholder="Enter Case Status"><br>

        <p>Letters CAPTCHA:</p>
        <canvas id="captchaCanvas2" width="220" height="80"></canvas><br>
        <input type="text" id="captchaInput2" placeholder="Enter letters here">
        <button type="button" onclick="generateCaptcha('captchaCanvas2')">↻ Refresh</button>
        <button class="submit" onclick="addCase()">Add / Update Case</button>
        <button class="submit" onclick="viewCases()">View All Cases</button>
        <div id="caseList"></div>
    </div>
</div>

<script>
// ---------- FORM SWITCH ----------
function showForm(type) {
    const suspectBtn = document.getElementById('suspectBtn');
    const caseBtn = document.getElementById('caseBtn');
    const suspectForm = document.getElementById('suspectForm');
    const caseForm = document.getElementById('caseForm');

    if (type === 'suspect') {
        suspectBtn.classList.add('active');
        caseBtn.classList.remove('active');
        suspectForm.style.display = 'block';
        caseForm.style.display = 'none';
    } else {
        caseBtn.classList.add('active');
        suspectBtn.classList.remove('active');
        caseForm.style.display = 'block';
        suspectForm.style.display = 'none';
    }
}

// ---------- CAPTCHA ----------
let captchaCodes = {};
function generateCaptcha(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    let code = "";
    for (let i = 0; i < 6; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    captchaCodes[canvasId] = code;

    for (let i = 0; i < code.length; i++) {
        ctx.font = `${Math.floor(Math.random() * 10) + 32}px Arial`;
        ctx.fillStyle = `rgb(${Math.random()*150}, ${Math.random()*150}, ${Math.random()*150})`;
        const x = 20 + i * 30;
        const y = 40 + Math.random() * 20;
        const angle = (Math.random() - 0.5) * 0.5;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.fillText(code[i], 0, 0);
        ctx.restore();
    }

    for (let i = 0; i < 6; i++) {
        ctx.strokeStyle = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.7)`;
        ctx.beginPath();
        ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
        ctx.stroke();
    }

    for (let i = 0; i < 50; i++) {
        ctx.fillStyle = `rgba(${Math.random()*255}, ${Math.random()*255}, ${Math.random()*255}, 0.6)`;
        ctx.beginPath();
        ctx.arc(Math.random()*canvas.width, Math.random()*canvas.height, 1, 0, 2*Math.PI);
        ctx.fill();
    }
}

// ---------- SUSPECT DATABASE ----------
const suspects = [
    { 
        aadhaar: "1234 5678 9012", 
        name: "R. Sharma", 
        state: "Maharashtra", 
        district: "Pune", 
        village: "Hinjewadi", 
        phone: "9876543210", 
        family: [
            { member: "Wife - S. Sharma", phone: "9988776655" },
            { member: "Son - A. Sharma", phone: "8877665544" }
        ] 
    },
    { 
        aadhaar: "2345 6789 0123", 
        name: "P. Verma", 
        state: "Uttar Pradesh", 
        district: "Lucknow", 
        village: "Aliganj", 
        phone: "8765432109", 
        family: [
            { member: "Father - V. Verma", phone: "7766554433" },
            { member: "Mother - R. Verma", phone: "6655443322" }
        ] 
    }
];

// ---------- SUSPECT CHECK ----------
function submitForm() {
    const aadhaar = document.getElementById('aadhaar').value.trim();
    const name = document.getElementById('name').value.trim();
    const captchaInput = document.getElementById('captchaInput1').value.trim();
    const resultDiv = document.getElementById('result');

    if (!aadhaar || !name) {
        resultDiv.style.color = 'red';
        resultDiv.textContent = "Please fill Aadhaar and Name.";
        return;
    }

    if (captchaInput !== captchaCodes['captchaCanvas1']) {
        resultDiv.style.color = 'red';
        resultDiv.textContent = "CAPTCHA does not match. Try again.";
        generateCaptcha('captchaCanvas1');
        document.getElementById('captchaInput1').value = "";
        return;
    }

    const found = suspects.find(s => 
        s.aadhaar === aadhaar &&
        s.name.toLowerCase() === name.toLowerCase()
    );

    if (found) {
        let familyDetails = "<ul>";
        found.family.forEach(f => {
            familyDetails += `<li><strong>${f.member}:</strong> ${f.phone}</li>`;
        });
        familyDetails += "</ul>";

        resultDiv.style.color = 'lightgreen';
        resultDiv.innerHTML = `
            <p>✅ Suspect Found:</p>
            <p><strong>Aadhaar:</strong> ${found.aadhaar}</p>
            <p><strong>Name:</strong> ${found.name}</p>
            <p><strong>State:</strong> ${found.state}</p>
            <p><strong>District:</strong> ${found.district}</p>
            <p><strong>Village:</strong> ${found.village}</p>
            <p><strong>Phone:</strong> ${found.phone}</p>
            <p><strong>Family Members:</strong></p>
            ${familyDetails}
        `;
    } else {
        resultDiv.style.color = 'orange';
        resultDiv.textContent = "⚠️ No suspect found.";
    }
}

// ---------- CASE TRACKING ----------
function getCases() { return JSON.parse(localStorage.getItem('cases') || '[]'); }
function saveCases(cases) { localStorage.setItem('cases', JSON.stringify(cases)); }

function addCase() {
    const id = document.getElementById('caseId').value.trim();
    const status = document.getElementById('caseStatus').value.trim();
    const captchaInput = document.getElementById('captchaInput2').value.trim();

    if (!id || !status) { alert("Please fill Case ID and Status."); return; }
    if (captchaInput !== captchaCodes['captchaCanvas2']) {
        alert("CAPTCHA does not match. Try again.");
        generateCaptcha('captchaCanvas2');
        document.getElementById('captchaInput2').value = "";
        return;
    }

    let cases = getCases();
    const existing = cases.find(c => c.id === id);
    if (existing) existing.status = status;
    else cases.push({ id, status });
    saveCases(cases);
    alert(`Case '${id}' saved successfully.`);
    viewCases();
}

function viewCases() {
    const cases = getCases();
    const caseListDiv = document.getElementById('caseList');
    if (cases.length === 0) {
        caseListDiv.innerHTML = "<p>No cases available.</p>";
        return;
    }
    caseListDiv.innerHTML = cases.map(c => `
        <div class="case-item">
            <strong>Case ID:</strong> ${c.id}<br>
            <strong>Status:</strong> ${c.status}
        </div>
    `).join('');
}

// Initialize both CAPTCHAs
generateCaptcha('captchaCanvas1');
generateCaptcha('captchaCanvas2');
</script>
</body>
</html>
