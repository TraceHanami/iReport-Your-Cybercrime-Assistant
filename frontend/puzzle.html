<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cybercrime Puzzle Game</title>
<style>
body {
  margin: 0; padding: 0; height: 100vh;
  display: flex; justify-content: center; align-items: center;
  background: url("assets/images/background.png") no-repeat center center fixed;
  background-size: cover;
  font-family: Arial, sans-serif; color: #fff;
  overflow: hidden;
}
#puzzleContent {
  background: rgba(20,20,20,0.8); 
  padding: 25px; border-radius: 16px;
  max-width: 900px; width: 90%; text-align: center; 
  box-shadow: 0 8px 16px rgba(0,0,0,0.6);
  overflow-y: auto; max-height: 90vh;
  position: relative; z-index: 5;
}
h2 { margin-top: 0; color: #00c4ff; }
button.game-option { 
  display: block; margin: 10px auto; padding: 12px; 
  background: #333; border-radius: 8px; cursor: pointer; 
  width: 80%; border: 2px solid transparent; 
  transition: 0.3s; color: #fff; font-size: 18px; 
}
button.game-option:hover { background: #555; border-color: #00c4ff; }
.close-btn { 
  background: #ff4444; color: #fff; border: none; 
  padding: 10px 18px; margin-top: 20px; cursor: pointer; 
  border-radius: 6px; font-weight: bold; 
}
#levelInfo { margin-bottom: 15px; font-size: 18px; color: #ffcc00; }
#puzzleArea { margin-top: 15px; position: relative; display:flex; justify-content:center; }
#malwareMaze { display: grid; gap: 2px; justify-content: center; margin-top: 10px; }
.cell { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border: 1px solid #555; font-size: 18px; cursor: pointer; }
.cell.safe { background: #222; }
.cell.malware { background: red; color: white; }
.cell.packet { background: #00ff00; color: black; }

/* Sidebar instructions */
.sidebarInstructions {
  position: absolute;
  top: 25px;
  right: -300px;
  width: 280px;
  background: rgba(0,0,0,0.85);
  color: #fff;
  padding: 15px;
  border-radius: 10px;
  font-size: 14px;
  text-align: left;
  box-shadow: 0 0 10px #00c4ff;
  transition: right 0.5s;
}
.sidebarInstructions.show { right: 10px; }

/* Floating animations for decoration */
.icon {
  position: absolute; 
  font-size: 40px; 
  opacity: 0.6; 
  animation: float 8s infinite ease-in-out;
}
@keyframes float {
  0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
  50% { transform: translateY(-30px) rotate(15deg); opacity: 1; }
  100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
}
.icon:nth-child(1) { top: 20%; left: 5%; animation-delay: 0s; }
.icon:nth-child(2) { top: 70%; left: 10%; animation-delay: 2s; }
.icon:nth-child(3) { top: 40%; right: 8%; animation-delay: 4s; }
.icon:nth-child(4) { bottom: 15%; right: 12%; animation-delay: 6s; }
</style>
</head>
<body>

<!-- Floating icons -->
<div class="icon">🔐</div>
<div class="icon">💻</div>
<div class="icon">🕵️‍♂️</div>
<div class="icon">⚡</div>

<div id="puzzleContent">
  <h2>Cybercrime Game</h2>
  <div id="gameMenu">
    <p>Select a game mode:</p>
    <button class="game-option" onclick="startPasswordPuzzle()">Password Puzzle</button>
    <button class="game-option" onclick="startPhishingPuzzle()">Phishing Detective</button>
    <button class="game-option" onclick="startMalwareMaze()">Malware Maze</button>
    <button class="game-option" onclick="startFirewallRunner()">Firewall Runner</button>
    <button class="game-option" onclick="startCyberHeist()">Cyber Heist Escape</button>
  </div>
  <p id="levelInfo"></p>
  <div id="puzzleArea"></div>
  <button class="close-btn" onclick="closePuzzle()">Close</button>
</div>

<!-- Instructions for games -->
<div id="instructions" class="sidebarInstructions"></div>

<script>
const gameMenu = document.getElementById("gameMenu");
const puzzleArea = document.getElementById("puzzleArea");
const levelInfo = document.getElementById("levelInfo");
const instructions = document.getElementById("instructions");
let currentGame="", currentLevel=1;

// ===== PASSWORD PUZZLE =====
function startPasswordPuzzle() {
  instructions.classList.remove('show');
  currentGame="password"; currentLevel=1;
  gameMenu.style.display="none";
  loadPasswordLevel();
}
function loadPasswordLevel(){
  levelInfo.textContent=`Password Puzzle - Level ${currentLevel}`;
  const passwordsPerLevel={
    1:["apple","cyber","matrix"],
    2:["P@ss123","Hack2024","Safe!42"],
    3:["Cyb3r$afe!","P@ssw0rd!2025","S3cur3#Data"],
    4:["D@t@Prot3ct!","S3cur3P@ss!","C0mpuT3r$afe"],
    5:["N3tw0rk!Sec#2025","M@lic1ous0v3r!","Cr!pt0Safe!42"]
  };
  const password=passwordsPerLevel[currentLevel][Math.floor(Math.random()*3)];
  const scrambled=password.split('').sort(()=>0.5-Math.random()).join('');
  puzzleArea.innerHTML=`<p>Scrambled: <b>${scrambled}</b></p>
    <input type="text" id="pwdInput" placeholder="Enter password">
    <button onclick="checkPasswordLevel('${password}')">Submit</button>
    <p id="pwdResult"></p>`;
}
function checkPasswordLevel(correct){
  const input=document.getElementById("pwdInput").value;
  const res=document.getElementById("pwdResult");
  if(input===correct){
    res.textContent="✅ Correct!";
    res.style.color="lightgreen";
    if(currentLevel<5)puzzleArea.innerHTML+=`<button class="game-option" onclick="nextPasswordLevel()">➡️ Next Level</button>`;
    else puzzleArea.innerHTML+=`<p>🏆 All Password Puzzle Levels Completed!</p>`;
  } else { res.textContent="❌ Incorrect. Try again."; res.style.color="tomato"; }
}
function nextPasswordLevel(){currentLevel++;loadPasswordLevel();}

// ===== PHISHING DETECTIVE =====
function startPhishingPuzzle() {
  instructions.classList.remove('show');
  currentGame="phishing"; currentLevel=1;
  gameMenu.style.display="none"; loadPhishingLevel();
}
function loadPhishingLevel(){
  levelInfo.textContent=`Phishing Detective - Level ${currentLevel}`;
  const emailsPerLevel={
    1:[{text:"Bank Alert: Click here", phishing:true},{text:"School newsletter", phishing:false}],
    2:[{text:"Paypal: Unauthorized login attempt", phishing:true},{text:"Company HR update", phishing:false}],
    3:[{text:"Secure your account at bank-secure.com", phishing:true},{text:"Official tax notice", phishing:false}],
    4:[{text:"Confirm payment info at paypal-secure.com", phishing:true},{text:"Team project update", phishing:false}],
    5:[{text:"Login to secure-email.com to update account", phishing:true},{text:"Company newsletter", phishing:false}]
  };
  const email=emailsPerLevel[currentLevel][Math.floor(Math.random()*2)];
  puzzleArea.innerHTML=`<p>${email.text}</p>
    <button onclick="checkEmailLevel(true,${email.phishing})">Phishing</button>
    <button onclick="checkEmailLevel(false,${email.phishing})">Safe</button>
    <p id="emailResult"></p>`;
}
function checkEmailLevel(selected, correct){
  const res=document.getElementById("emailResult");
  if(selected===correct){ res.textContent="✅ Correct!"; res.style.color="lightgreen";
    if(currentLevel<5)puzzleArea.innerHTML+=`<button class="game-option" onclick="nextPhishingLevel()">➡️ Next Level</button>`;
    else puzzleArea.innerHTML+=`<p>🏆 All Phishing Detective Levels Completed!</p>`;
  } else { res.textContent="❌ Wrong!"; res.style.color="tomato"; }
}
function nextPhishingLevel(){currentLevel++; loadPhishingLevel();}

// ===== MALWARE MAZE =====
function startMalwareMaze() {
  instructions.classList.remove('show');
  currentGame="maze"; currentLevel=1; gameMenu.style.display="none";
  loadMazeLevel();
}
function loadMazeLevel(){
  levelInfo.textContent=`Malware Maze - Level ${currentLevel}`;
  const sizeMap={1:6,2:7,3:8,4:9,5:10};
  const dangerMap={1:0.2,2:0.25,3:0.3,4:0.35,5:0.4};
  const size=sizeMap[currentLevel], malwareChance=dangerMap[currentLevel];
  const maze=[], packet={x:0,y:0}, exit={x:size-1,y:size-1};
  for(let i=0;i<size;i++){ maze[i]=[]; for(let j=0;j<size;j++){ maze[i][j]=(Math.random()<malwareChance && !(i===0 && j===0) && !(i===exit.x && j===exit.y))?'malware':'safe';}}
  function renderMaze(){
    puzzleArea.innerHTML=`<div id="malwareMaze" style="display:grid;grid-template-columns:repeat(${size},40px);gap:2px;"></div>`;
    const grid=document.getElementById("malwareMaze");
    for(let i=0;i<size;i++){for(let j=0;j<size;j++){
      const cell=document.createElement("div"); cell.className='cell '+maze[i][j];
      if(i===packet.x && j===packet.y)cell.classList.add('packet');
      if(i===exit.x && j===exit.y)cell.textContent='🏁';
      grid.appendChild(cell);
    }}
  }
  function move(dx,dy){
    const nx=packet.x+dx, ny=packet.y+dy;
    if(nx<0||ny<0||nx>=size||ny>=size)return;
    packet.x=nx; packet.y=ny;
    if(maze[nx][ny]==='malware'){ alert("💥 You hit malware!"); packet.x=0; packet.y=0;}
    else if(packet.x===exit.x && packet.y===exit.y){ alert("🏆 Level Complete!"); if(currentLevel<5){currentLevel++; loadMazeLevel();} else alert("🏆 All Malware Maze Levels Completed!");}
    renderMaze();
  }
  renderMaze();
  document.onkeydown=(e)=>{if(e.key==='ArrowUp')move(-1,0); if(e.key==='ArrowDown')move(1,0); if(e.key==='ArrowLeft')move(0,-1); if(e.key==='ArrowRight')move(0,1);}
}

// ===== FIREWALL RUNNER =====
function startFirewallRunner(){
  currentGame="firewall"; currentLevel=1;
  instructions.innerHTML=`<h3>Firewall Runner Instructions</h3>
  <ul><li>Use <b>Arrow Left/Right</b> to move firewall</li>
  <li>Dodge falling <span style="color:red;">Malware</span> and <span style="color:yellow;">Phishing</span></li>
  <li>Each obstacle avoided increases score</li>
  <li>3 hits = Game Over</li></ul>`; instructions.classList.add('show');
  gameMenu.style.display="none";
  puzzleArea.innerHTML=`<canvas id="runnerCanvas" width="600" height="400" style="background:#111; display:block; margin:0 auto; border:2px solid #00c4ff;"></canvas>`;
  levelInfo.textContent="Firewall Runner - Survive!";
  const canvas=document.getElementById('runnerCanvas'); const ctx=canvas.getContext('2d');
  const player={x:270,y:350,width:60,height:30}; let obstacles=[], score=0, lives=3, gameOver=false;
  document.onkeydown=function(e){if(e.key==='ArrowLeft')player.x-=20;if(e.key==='ArrowRight')player.x+=20;if(player.x<0)player.x=0;if(player.x>canvas.width-player.width)player.x=canvas.width-player.width;}
  function spawnObstacle(){const types=['malware','phishing']; const type=types[Math.floor(Math.random()*types.length)]; const width=type==='phishing'?40:60; obstacles.push({x:Math.random()*(canvas.width-width), y:-30, width, height:30, type});}
  function updateGame(){ if(gameOver)return; ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle='lime'; ctx.fillRect(player.x,player.y,player.width,player.height);
    if(Math.random()<0.03)spawnObstacle();
    for(let i=0;i<obstacles.length;i++){ let ob=obstacles[i]; ob.y+=4+currentLevel; ctx.fillStyle=ob.type==='malware'?'red':'yellow'; ctx.fillRect(ob.x,ob.y,ob.width,ob.height);
      if(ob.y+ob.height>player.y && ob.y<player.y+player.height && ob.x+ob.width>player.x && ob.x<player.x+player.width){ lives--; obstacles.splice(i,1); i--; if(lives<=0){ alert("💥 Game Over! Score: "+score); gameOver=true; closePuzzle(); return;} }
      if(ob.y>canvas.height){ obstacles.splice(i,1); i--; score++; }
    }
    requestAnimationFrame(updateGame);
  }
  updateGame();
}

// ===== CYBER HEIST ESCAPE =====
function startCyberHeist(){
  currentGame="heist"; currentLevel=1;
  instructions.innerHTML=`<h3>Cyber Heist Escape Instructions</h3>
  <ul><li>Use <b>Arrow Keys</b> to move your hacker</li>
  <li>Collect <span style="color:green;">Data Packets</span> to score points</li>
  <li>Avoid <span style="color:red;">Security Drones</span></li>
  <li>3 hits = Game Over</li>
  <li>Survive and collect all packets to win!</li></ul>`;
  instructions.classList.add('show');
  gameMenu.style.display="none";
  puzzleArea.innerHTML=`<canvas id="heistCanvas" width="600" height="400" style="background:#111; display:block; margin:0 auto; border:2px solid #00c4ff;"></canvas>`;
  levelInfo.textContent="Cyber Heist Escape!";
  const canvas=document.getElementById('heistCanvas'); const ctx=canvas.getContext('2d');
  const player={x:280,y:350,width:40,height:40}; let obstacles=[], packets=[], score=0, lives=3, gameOver=false;
  document.onkeydown=function(e){if(e.key==='ArrowLeft')player.x-=20;if(e.key==='ArrowRight')player.x+=20;if(e.key==='ArrowUp')player.y-=20;if(e.key==='ArrowDown')player.y+=20;
    if(player.x<0)player.x=0;if(player.x>canvas.width-player.width)player.x=canvas.width-player.width;if(player.y<0)player.y=0;if(player.y>canvas.height-player.height)player.y=canvas.height-player.height;}
  function spawnObjects(){
    if(Math.random()<0.02)obstacles.push({x:Math.random()*560,y:-40,width:40,height:40});
    if(Math.random()<0.01)packets.push({x:Math.random()*20+Math.random()*560,y:-30,width:20,height:20});
  }
  function updateHeist(){
    if(gameOver)return;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='cyan'; ctx.fillRect(player.x,player.y,player.width,player.height);
    spawnObjects();
    for(let i=0;i<obstacles.length;i++){ let ob=obstacles[i]; ob.y+=4+currentLevel; ctx.fillStyle='red'; ctx.fillRect(ob.x,ob.y,ob.width,ob.height);
      if(ob.y+ob.height>player.y && ob.y<player.y+player.height && ob.x+ob.width>player.x && ob.x<player.x+player.width){ lives--; obstacles.splice(i,1); i--; if(lives<=0){alert("💥 Game Over! Score:"+score); gameOver=true; closePuzzle(); return;}}
      if(ob.y>canvas.height){ obstacles.splice(i,1); i--; }
    }
    for(let i=0;i<packets.length;i++){ let p=packets[i]; p.y+=3; ctx.fillStyle='green'; ctx.fillRect(p.x,p.y,p.width,p.height);
      if(p.y+ p.height>player.y && p.y<player.y+player.height && p.x+p.width>player.x && p.x<player.x+player.width){ score+=5; packets.splice(i,1); i--;}
      if(p.y>canvas.height){ packets.splice(i,1); i--; }
    }
    ctx.fillStyle='yellow'; ctx.font='18px Arial'; ctx.fillText("Score: "+score,10,20); ctx.fillText("Lives: "+lives,10,40);
    requestAnimationFrame(updateHeist);
  }
  updateHeist();
}

// ===== CLOSE PUZZLE =====
function closePuzzle(){
  document.onkeydown=null;
  gameMenu.style.display="block";
  puzzleArea.innerHTML="";
  levelInfo.textContent="";
  instructions.classList.remove('show');
}
</script>

</body>
</html>
