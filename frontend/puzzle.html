<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cybercrime Puzzle Game </title>
<style>
/* Basic layout */
body {
  margin: 0; padding: 0; height: 100vh;
  display: flex; justify-content: center; align-items: center;
  background: url("assets/images/background.png") no-repeat center center fixed;
  background-size: cover;
  font-family: Arial, sans-serif; color: #fff;
  overflow: hidden;
}
#puzzleContent {
  background: rgba(16,16,16,0.9);
  padding: 25px; border-radius: 16px;
  max-width: 1000px; width: 95%; text-align: center;
  box-shadow: 0 8px 24px rgba(0,0,0,0.7);
  overflow-y: auto; max-height: 90vh;
  position: relative; z-index: 5;
}
h2 { margin-top: 0; color: #00c4ff; }
button.game-option {
  display: block; margin: 10px auto; padding: 12px;
  background: linear-gradient(180deg,#2a2a2a,#222);
  border-radius: 8px; cursor: pointer;
  width: 80%; border: 2px solid transparent;
  transition: 0.2s; color: #fff; font-size: 18px;
}
button.game-option:hover { background: #333; border-color: #00c4ff; }
.close-btn {
  background: #ff4444; color: #fff; border: none;
  padding: 10px 18px; margin-top: 20px; cursor: pointer;
  border-radius: 6px; font-weight: bold;
}
#levelInfo { margin-bottom: 12px; font-size: 18px; color: #ffcc00; }
#puzzleArea { margin-top: 12px; position: relative; display:flex; justify-content:center; }

/* Simple terminal style */
#terminal {
  background: #020617; color: #33ff88; padding: 14px; border-radius: 8px;
  width: 100%; max-width: 760px; height: 260px; overflow:auto; text-align:left;
  box-shadow: inset 0 0 18px rgba(0,255,136,0.03);
  font-family: "Courier New", monospace; font-size: 14px;
}

/* Input styles */
input[type="text"], input[type="password"]{
  padding: 10px; border-radius:6px; border:1px solid #333; width:60%;
  background:#111; color:#fff; margin:8px 0; font-size:16px;
}
.small { font-size:13px; color:#bcd; margin-top:8px; }

/* sidebar instructions */
.sidebarInstructions {
  position: absolute;
  top: 20px;
  right: -340px;
  width: 320px;
  background: rgba(2,10,20,0.95);
  color: #fff;
  padding: 14px;
  border-radius: 10px;
  font-size: 14px;
  text-align: left;
  box-shadow: 0 0 16px rgba(0,196,255,0.08);
  transition: right 0.42s;
  line-height:1.4;
}
.sidebarInstructions.show { right: 12px; }

/* floating icons */
.icon {
  position: absolute;
  font-size: 40px;
  opacity: 0.6;
  animation: float 8s infinite ease-in-out;
}
@keyframes float {
  0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
  50% { transform: translateY(-20px) rotate(10deg); opacity: 1; }
  100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
}

#map {
  position: relative;
  width: 800px;
  height: 400px;
  background: #111;
}
.level {
  position: absolute;
  width: 50px;
  height: 50px;
  background: #00c4ff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
}
.level.locked {
  background: gray;
  cursor: not-allowed;
}

.icon:nth-child(1) { top: 12%; left: 6%; animation-delay: 0s; }
.icon:nth-child(2) { top: 72%; left: 8%; animation-delay: 1.5s; }
.icon:nth-child(3) { top: 42%; right: 8%; animation-delay: 3s; }
.icon:nth-child(4) { bottom: 18%; right: 14%; animation-delay: 4.5s; }

/* buttons within puzzle area */
.inline-btn { padding:8px 12px; border-radius:6px; border:none; cursor:pointer; margin:6px; background:#00c4ff; color:#021; font-weight:700; }
.inline-btn.alt { background:transparent; border:1px solid #00c4ff; color:#00c4ff; font-weight:700; }

/* scoreboard */
#scoreBoard { margin-top:10px; font-size:15px; color:#bcd; }

/* canvas styles (cyber heist) */
canvas { border-radius:8px; }
</style>
</head>
<body>

<!-- Floating icons -->
<div class="icon">🔐</div>
<div class="icon">💻</div>
<div class="icon">🕵️‍♂️</div>
<div class="icon">⚡</div>

<div id="puzzleContent">
  <h2>Cybercrime Game Hub</h2>
  <div id="gameMenu">
    <p>Select a game mode:</p>
    <button class="game-option" onclick="startPasswordPuzzle()">Password Puzzle</button>
    <button class="game-option" onclick="startPhishingPuzzle()">Phishing Detective </button>
    <button class="game-option" onclick="startCracker()">Password Cracker (Mini)</button>
    <button class="game-option" onclick="startSQLInjection()">SQL Injection Mock</button>
    
    </div>
    </div>

  <p id="levelInfo"></p>
  <div id="puzzleArea"></div>
  <button class="close-btn" onclick="closePuzzle()">Close</button>
</div>

<!-- Instructions for games -->
<div id="instructions" class="sidebarInstructions"></div>

<script>
/* Global refs */
const gameMenu = document.getElementById("gameMenu");
const puzzleArea = document.getElementById("puzzleArea");
const levelInfo = document.getElementById("levelInfo");
const instructions = document.getElementById("instructions");
let currentGame="", currentLevel=1;
let keyboardHandler = null; // used to track any document.onkeydown binding
let phishingScore = 0;

/* ---------- PASSWORD PUZZLE (original) ---------- */
/* ---------- PASSWORD PUZZLE ---------- */

function startPasswordPuzzle() {
  closeKeyboardHandler();
  instructions.classList.remove('show');
  currentGame = "password";
  currentLevel = 1;
  gameMenu.style.display = "none";
  loadPasswordLevel();
}

function loadPasswordLevel(){
  levelInfo.textContent = `Password Puzzle - Level ${currentLevel}`;

  // Expanded password bank
  const passwordsPerLevel = {
    1:["apple","cyber","matrix"],
    2:["P@ss123","Hack2024","Safe!42"],
    3:["Cyb3r$afe!","P@ssw0rd!2025","S3cur3#Data"],
    4:["D@t@Prot3ct!","S3cur3P@ss!","C0mpuT3r$afe"],
    5:["N3tw0rk!Sec#2025","M@lic1ous0v3r!","Cr!pt0Safe!42"],
    6:["$up3rC0mpl3xP@ss","L0ck!tD0wn#2025","Dat@_Sh13ld99"],
    7:["Ultr@S3cure_P@ssw0rd","#H@ckR3sist4nt2025","P@ssC0d3_Xtr3me!"],
    8:["#M3g@_Unbr3@k@bleP@ss","S3cur1ty!L@yer$#99","Cyb3rW@ll_F0rtress2025"]
  };

  const password = passwordsPerLevel[currentLevel][Math.floor(Math.random()*3)];
  const scrambled = password.split('').sort(()=>0.5-Math.random()).join('');

  puzzleArea.innerHTML = `
    <div style="max-width:760px">
      <p class="small">Unscramble the password:</p>
      <p style="font-size:20px;padding:8px;background:#071025;border-radius:6px;" id="scrambleBox">${scrambled}</p>
      <input type="text" id="pwdInput" placeholder="Enter password">
      <div>
        <button class="inline-btn" onclick="checkPasswordLevel('${password}')">Submit</button>
        <button class="inline-btn" onclick="showPasswordHint('${password}')">💡 Hint</button>
      </div>
      <p id="pwdResult"></p>
    </div>`;
}

function checkPasswordLevel(correct){
  const input = document.getElementById("pwdInput").value.trim();
  const res = document.getElementById("pwdResult");
  const scrambleBox = document.getElementById("scrambleBox");

  if(!input){ 
    res.textContent = "⚠️ Enter something..."; 
    res.style.color = "#ffd"; 
    return; 
  }

  if(input === correct){
    res.textContent = "✅ Correct!";
    res.style.color = "lightgreen";

    // Add animation effect
    scrambleBox.style.animation = "flashGreen 1s ease";
    setTimeout(()=>{ scrambleBox.style.animation = ""; }, 1000);

    if(currentLevel < 8) 
      puzzleArea.innerHTML += `<div><button class="inline-btn" onclick="nextPasswordLevel()">➡️ Next Level</button></div>`;
    else 
      puzzleArea.innerHTML += `<p>🏆 All Password Puzzle Levels Completed!</p>`;
  } else { 
    res.textContent = "❌ Incorrect. Try again."; 
    res.style.color = "tomato"; 
  }
}

function nextPasswordLevel(){ 
  currentLevel++; 
  loadPasswordLevel(); 
}

function showPasswordHint(password){
  let hint = password[0] + "*".repeat(password.length-2) + password[password.length-1];
  document.getElementById("pwdResult").textContent = "💡 Hint: " + hint;
  document.getElementById("pwdResult").style.color = "#ffcc00";
}
const phishingLevels = {
  1: [
    {id:1,subject:"Bank Alert: Click here to confirm", sender:"alerts@secure-bank.com", phishing:true, hint:"Urgent language + link"},
    {id:2,subject:"School newsletter - March", sender:"newsletter@school.edu", phishing:false, hint:"Known sender"}
  ],
  2: [
    {id:1,subject:"Paypal: Unauthorized login attempt", sender:"paypal@security.com", phishing:true, hint:"Sender domain mismatch"},
    {id:2,subject:"Team calendar update", sender:"calendar@company.com", phishing:false, hint:"Expected content"}
  ],
  3: [
    {id:1,subject:"Secure your account at bank-secure.com", sender:"support@bank-secure.com", phishing:true, hint:"Lookalike domain"},
    {id:2,subject:"Official tax notice", sender:"taxes@gov.gov", phishing:false, hint:"Proper domain and form"}
  ],
  4: [
    {id:1,subject:"Confirm payment info at paypal-secure.com", sender:"support@paypal-secure.com", phishing:true, hint:"typo-squatting domain"},
    {id:2,subject:"Team project update", sender:"pm@company.com", phishing:false, hint:"normal workplace email"}
  ],
  5: [
    {id:1,subject:"Login to secure-email.com to update account", sender:"it@secure-email.com", phishing:true, hint:"suspicious domain + request for login"},
    {id:2,subject:"Company newsletter - Q2", sender:"newsletter@company.com", phishing:false, hint:"routine newsletter"}
  ],
  6: [
    {id:1,subject:"Your subscription was renewed — verify", sender:"subscriptions@pay-service.com", phishing:true, hint:"unexpected renewal + link"},
    {id:2,subject:"Meeting minutes (internal)", sender:"hr@company.com", phishing:false, hint:"internal known sender"}
  ],
  7: [
    {id:1,subject:"Security Update Required — Run Attachment", sender:"security@trustedcorp.com", phishing:true, hint:"attachment prompt + urgency"},
    {id:2,subject:"Invoice for Services", sender:"invoices@vendor.com", phishing:false, hint:"expected invoice from vendor"}
  ]
};
function startPhishingPuzzle(){
  closeKeyboardHandler();
  currentGame="phishing";
  currentLevel=1;
  phishingScore = 0;
  gameMenu.style.display="none";
  instructions.innerHTML = `<h3>Phishing Detective</h3>
    <p>Read the email snippet and decide: <b>Phishing</b> or <b>Safe</b>.</p>
    <p>Levels get harder: look for sender domain tricks, urgency, mismatched links, attachments, and other red flags.</p>
    <p class="small">Your score increases on correct answers and you get explanations after each choice.</p>
    <div id="scoreBoard">Score: 0</div>`;
  instructions.classList.add('show');
  loadPhishingLevel();
}
function loadPhishingLevel(){
  levelInfo.textContent=`Phishing Detective - Level ${currentLevel}`;
  const pool = phishingLevels[currentLevel];
  if(!pool){ puzzleArea.innerHTML="<p>No more levels.</p>"; return; }
  const email = pool[Math.floor(Math.random()*pool.length)];
  const link = (email.phishing) ? `http://${email.sender.split('@')[1]}/login` : `https://portal.${email.sender.split('@')[1]}/account`;
  const attachments = (Math.random()<0.25 && email.phishing) ? `<p><b>Attachment:</b> security_update.exe</p>` : "";
  const body = `
    <div style="max-width:780px;text-align:left;background:#071025;padding:12px;border-radius:8px;">
      <p style="margin:0 0 6px 0;"><strong>From:</strong> ${email.sender}</p>
      <p style="margin:0 0 6px 0;"><strong>Subject:</strong> ${email.subject}</p>
      <hr style="opacity:0.06">
      <p style="margin:6px 0;">Dear user,</p>
      <p style="margin:6px 0;">We have detected unusual activity on your account. Please <a href="#" onclick="return false" style="color:#ffd;">click here</a> to verify your details: <span style="color:#ffd">${link}</span></p>
      ${attachments}
      <p style="margin:6px 0;">Regards,<br>Security Team</p>
    </div>
    <div style="margin-top:10px;">
      <button class="inline-btn" onclick="checkEmailLevel(true, ${email.phishing}, ${currentLevel})">Phishing</button>
      <button class="inline-btn alt" onclick="checkEmailLevel(false, ${email.phishing}, ${currentLevel})">Safe</button>
      <p id="emailResult"></p>
    </div>
  `;
  puzzleArea.innerHTML = body;
}

function checkEmailLevel(selected, correct, lvl){
  const res=document.getElementById("emailResult");
  const scoreBoard = document.getElementById("scoreBoard");
  const pool = phishingLevels[lvl];
  const subj = puzzleArea.querySelector('strong + p')?.innerText || "";
  if(selected === correct){
    phishingScore += 10;
    res.innerHTML = `<span style="color:lightgreen">✅ Correct.</span> <em>${explainPhish(correct, lvl)}</em>`;
    if(currentLevel < Object.keys(phishingLevels).length){
      res.innerHTML += `<div style="margin-top:8px;"><button class="inline-btn" onclick="nextPhishingLevel()">➡️ Next Level</button></div>`;
    } else {
      res.innerHTML += `<div style="margin-top:8px;color:#ffd">🏆 Phishing Detective completed! Final Score: ${phishingScore}</div>`;
    }
  } else {
    phishingScore -= 5;
    res.innerHTML = `<span style="color:tomato">❌ Wrong.</span> <em>${explainPhish(!correct, lvl)}</em>`;
    res.innerHTML += `<div style="margin-top:8px;"><button class="inline-btn" onclick="retryPhishingLevel()">Try Again</button></div>`;
  }
  scoreBoard.textContent = `Score: ${phishingScore}`;
}

function explainPhish(correctAnswer, lvl){
  const sample = phishingLevels[lvl][0]; 
  if(correctAnswer){
    return `Main indicators: ${sample.hint}. Look for domain spelling, unexpected attachments, or urgent calls to action.`;
  } else {
    return `Look carefully: ${sample.hint}. Suspicious links, mismatched domains and urgent language are common red flags.`;
  }
}

function nextPhishingLevel(){ currentLevel++; loadPhishingLevel(); }
function retryPhishingLevel(){ loadPhishingLevel(); }
function startCracker(){
  closeKeyboardHandler();
  currentGame="cracker"; gameMenu.style.display="none";
  levelInfo.textContent="Password Cracker (Mini)";
  instructions.innerHTML = `<h3>Password Cracker</h3><p>Guess the static password. Hint: It contains "cyber".</p>`;
  instructions.classList.add('show');
  puzzleArea.innerHTML=`
    <div style="max-width:720px">
      <input type="password" id="crackerInput" placeholder="Enter password">
      <div><button class="inline-btn" onclick="checkCracker()">Hack</button></div>
      <p id="crackerResult"></p>
      <p class="small">Tip: password is fairly simple (teaching/demo only).</p>
    </div>`;
}
function checkCracker(){
  const password="cyber123";
  const g=document.getElementById("crackerInput").value;
  const r=document.getElementById("crackerResult");
  if(!g){ r.textContent="Enter something."; r.style.color="#ffd"; return; }
  if(g===password){ r.textContent="✅ Access Granted"; r.style.color="lightgreen"; } 
  else { r.textContent="❌ Access Denied"; r.style.color="tomato"; }
}
function startSQLInjection(){
  closeKeyboardHandler();
  currentGame="sql"; gameMenu.style.display="none";
  levelInfo.textContent="SQL Injection Mock";
  instructions.innerHTML = `<h3>SQL Injection Practice</h3>
    <p>Try normal login (<b>admin / 1234</b>) or bypass with a classic injection <b>' OR '1'='1</b>.</p>`;
  instructions.classList.add('show');
  puzzleArea.innerHTML=`
    <div style="max-width:720px;text-align:center">
      <input id="sqlUser" placeholder="Username"><br>
      <input id="sqlPass" type="password" placeholder="Password"><br>
      <div><button class="inline-btn" onclick="checkSQL()">Login</button></div>
      <p id="sqlResult"></p>
      <p class="small">This is a mock — it simulates server-side behavior to teach the concept only.</p>
    </div>`;
}
function checkSQL(){
  let u=document.getElementById("sqlUser").value;
  let p=document.getElementById("sqlPass").value;
  let msg=document.getElementById("sqlResult");
  if(!u && !p){ msg.textContent="Enter credentials."; msg.style.color="#ffd"; return; }
  if((u==="admin" && p==="1234") || p.includes("' OR '1'='1") || p.toLowerCase().includes("or 1=1")){
    msg.innerHTML = "✅ Login Bypassed! (Demonstration of injection)";
    msg.style.color="lightgreen";
  } else {
    msg.textContent = "❌ Access Denied";
    msg.style.color="tomato";
  }
}
function startSQLInjection(){
  closeKeyboardHandler();
  currentGame="sql"; 
  gameMenu.style.display="none";
  levelInfo.textContent="SQL Injection Mock";

  // Short instructions
  instructions.innerHTML = `
    <h3>SQL Injection Practice</h3>
    <p>Try logging in normally with <b>admin / 1234</b> OR 
    use a classic SQL injection string: <code>' OR '1'='1</code>.</p>
    <p><small>This is a safe mock. It only teaches how SQL injection works, not real hacking.</small></p>`;
  instructions.classList.add('show');

  // Puzzle UI
  puzzleArea.innerHTML = `
    <div style="max-width:720px;text-align:center">
      <input id="sqlUser" placeholder="Username"><br>
      <input id="sqlPass" type="password" placeholder="Password"><br>
      <div>
        <button class="inline-btn" onclick="checkSQL()">Login</button>
        <button class="inline-btn" onclick="closePuzzle()">Exit</button>
      </div>
      <p id="sqlResult"></p>
    </div>`;
}

function checkSQL(){
  let u=document.getElementById("sqlUser").value.trim();
  let p=document.getElementById("sqlPass").value.trim();
  let msg=document.getElementById("sqlResult");

  if(!u && !p){ 
    msg.textContent="⚠️ Enter username and password."; 
    msg.style.color="#ffd"; 
    return; 
  }

  if((u==="admin" && p==="1234") || 
      p.includes("' OR '1'='1") || 
      p.toLowerCase().includes("or 1=1")){
    msg.innerHTML = "✅ Login Bypassed! You just simulated SQL Injection!";
    msg.style.color="lightgreen";
  } else {
    msg.textContent = "❌ Access Denied";
    msg.style.color="tomato";
  }
}
function closeKeyboardHandler(){
  if(keyboardHandler){
    document.removeEventListener('keydown', keyboardHandler);
    keyboardHandler = null;
  }
}
function closePuzzle(){
  closeKeyboardHandler();
  try { document.onkeydown = null; } catch(e){}
  gameMenu.style.display="block";
  puzzleArea.innerHTML="";
  levelInfo.textContent="";
  instructions.classList.remove('show');
  currentGame = "";
}
</script>

</body>
</html>
