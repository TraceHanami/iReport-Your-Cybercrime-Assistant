<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - iReport</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-shield-alt"></i>
            <span>iReport</span>
        </div>
        <div class="nav-links">
            <a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <div id="userNav"></div>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2 class="text-center"><i class="fas fa-user-edit"></i> Edit Profile</h2>
            
            <form id="profileForm">
                <div class="form-group">
                    <label for="username"><i class="fas fa-user"></i> Username</label>
                    <input type="text" id="username" class="form-control" readonly>
                </div>

                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="email" class="form-control" readonly>
                </div>

                <div class="form-group">
                    <label for="fullName"><i class="fas fa-id-card"></i> Full Name</label>
                    <input type="text" id="fullName" class="form-control">
                </div>

                <div class="form-group">
                    <label for="phone"><i class="fas fa-phone"></i> Phone Number</label>
                    <input type="tel" id="phone" class="form-control">
                </div>

                <div class="form-group">
                    <label for="currentPassword"><i class="fas fa-lock"></i> Current Password</label>
                    <input type="password" id="currentPassword" class="form-control">
                </div>

                <div class="form-group">
                    <label for="newPassword"><i class="fas fa-lock"></i> New Password</label>
                    <input type="password" id="newPassword" class="form-control">
                </div>

                <div class="form-group">
                    <label for="confirmPassword"><i class="fas fa-lock"></i> Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <i class="fas fa-save"></i> Update Profile
                </button>
            </form>

            <div class="mt-3 text-center">
                <a href="user.html" class="btn btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script src="../assets/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!authHelper.redirectIfNotLoggedIn()) return;
            authHelper.setupNavigation();
            loadUserProfile();
        });

        function loadUserProfile() {
            const user = authHelper.getCurrentUser();
            if (user) {
                document.getElementById('username').value = user.username || '';
                document.getElementById('email').value = user.email || '';
                document.getElementById('fullName').value = user.full_name || '';
                document.getElementById('phone').value = user.phone || '';
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword && newPassword !== confirmPassword) {
                utils.showAlert('New passwords do not match!', 'error');
                return;
            }

            // In a real application, this would call an API to update the profile
            utils.showAlert('Profile updated successfully! (This is a demo - no changes were saved)', 'success');
            
            setTimeout(() => {
                window.location.href = 'user.html';
            }, 2000);
        });
    </script>
</body>
</html>
