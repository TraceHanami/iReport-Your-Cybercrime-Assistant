<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTB Dashboard Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: url('https://images.unsplash.com/photo-1510511459019-5dda7724fd87?auto=format&fit=crop&w=1920&q=80');
      --text-color: #fff;
      --card-bg: rgba(255, 255, 255, 0.1);
      --inner-card-bg: rgba(255, 255, 255, 0.2);
      --shadow-color: rgba(0, 0, 0, 0.3);
      --btn-bg: #00c853;
    }
    body.light-mode {
      --bg-dark: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1920&q=80');
      --text-color: #111;
      --card-bg: rgba(255, 255, 255, 0.7);
      --inner-card-bg: rgba(255, 255, 255, 0.8);
      --shadow-color: rgba(0, 0, 0, 0.1);
      --btn-bg: #0078d7;
    }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      font-family: "Poppins", sans-serif;
      color: var(--text-color);
      background: var(--bg-dark) no-repeat center center/cover;
      background-attachment: fixed;
      min-height: 100vh;
      transition: all 0.3s ease;
    }
    .bg-fixed {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg-dark) no-repeat center center/cover;
      z-index: -1;
      pointer-events: none;
    }

    /* Floating Buttons */
    .theme-toggle, .live-chart-btn {
      position: fixed;
      top: 20px;
      z-index: 1000;
      cursor: pointer;
    }
    .theme-toggle {
      left: 20px;
      background: transparent;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      border-radius: 50%;
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }
    .theme-toggle:hover { background: var(--inner-card-bg); }
    .live-chart-btn {
      right: 20px;
      background: var(--btn-bg);
      color: #fff;
      border: none;
      border-radius: 25px;
      padding: 10px 18px;
      font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 3px 10px var(--shadow-color);
      transition: background 0.3s ease;
    }
    .live-chart-btn:hover { background: #00a544; }

    /* Main Container */
    .main-container {
      background: var(--card-bg);
      margin: 40px auto;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px var(--shadow-color);
      backdrop-filter: blur(15px);
      max-width: 1200px;
    }
    .main-container header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .main-container h2 { margin-bottom: 20px; }
    .dashboard-stats {
      display: flex;
      justify-content: space-around;
      margin-bottom: 30px;
    }
    .stat {
      text-align: center;
      background: var(--inner-card-bg);
      padding: 20px;
      border-radius: 12px;
      width: 30%;
    }
    .progress-bar {
      height: 8px;
      background: #0073e6;
      border-radius: 5px;
      margin-top: 5px;
    }
    .inner-box {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }
    .module {
      background: var(--inner-card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.3s ease;
    }
    .module:hover { transform: scale(1.05); }
    .module button {
      background: var(--btn-bg);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      color: white;
      transition: background 0.3s ease;
    }
    .module button:hover { background:#00a544; }

    @media(max-width: 900px) { .inner-box { grid-template-columns: repeat(2,1fr); } }
    @media(max-width: 500px) { .inner-box { grid-template-columns: 1fr; } }

  </style>
</head>
<body>
  <div class="bg-fixed"></div>

  <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-adjust"></i></button>
  
  <div class="main-container">
    <header>
      <h2>Dashboard</h2>
      <div>
        <button class="module-btn" onclick="toggleSidebar()">Account</button>
        <button class="module-btn">Purchase Cubes</button>
      </div>
    </header>

    <div class="dashboard-stats">
      <div class="stat">
        <h3>0.00%</h3>
        <p>Offensive</p>
      </div>
      <div class="stat">
        <h3>0.00%</h3>
        <p>Defensive</p>
      </div>
      <div class="stat">
        <h3>7.37%</h3>
        <p>General</p>
      </div>
    </div>

    <h2>Currently Enrolled Path</h2>
    <div class="inner-box">
      <div class="module"><span>Intro to Academy</span><button>View</button></div>
      <div class="module"><span>Learning Process</span><button>View</button></div>
      <div class="module"><span>Setting Up</span><button>Unlock</button></div>
      <div class="module"><span>Linux Fundamentals</span><button>Continue</button></div>
      <div class="module"><span>Windows Fundamentals</span><button>Unlock</button></div>
    </div>
  </div>

  <script>
    function toggleSidebar(){
      alert("Sidebar toggled! You can implement this functionality.");
    }

    function toggleTheme(){
      document.body.classList.toggle('light-mode');
    }
  </script>
</body>
</html>
