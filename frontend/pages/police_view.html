<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Details - iReport</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-shield-alt"></i>
            <span>iReport</span>
        </div>
        <div class="nav-links">
            <a href="police.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <div id="userNav"></div>
        </div>
    </nav>

    <div class="container">
        <div id="caseDetails">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="../assets/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!authHelper.redirectIfNotLoggedIn('police')) return;
            authHelper.setupNavigation();
            loadCaseDetails();
        });

        async function loadCaseDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const caseId = urlParams.get('case_id');
            
            if (!caseId) {
                document.getElementById('caseDetails').innerHTML = `
                    <div class="alert alert-error">
                        No case ID provided.
                    </div>
                `;
                return;
            }

            try {
                const caseData = await apiService.trackComplaint(caseId);
                displayCaseDetails(caseData);
            } catch (error) {
                console.error('Error loading case details:', error);
                document.getElementById('caseDetails').innerHTML = `
                    <div class="alert alert-error">
                        Error loading case details. Please try again.
                    </div>
                `;
            }
        }

        function displayCaseDetails(caseData) {
            document.getElementById('caseDetails').innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-file-alt"></i> Case: ${caseData.case_id}</h2>
                        <div>
                            <span class="badge ${utils.getStatusBadge(caseData.status)}">${caseData.status}</span>
                            <span class="badge ${utils.getStatusBadge(caseData.priority)}">${caseData.priority}</span>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="dashboard-card">
                            <h4><i class="fas fa-user"></i> Complainant Details</h4>
                            <p><strong>Name:</strong> ${caseData.name || 'Anonymous'}</p>
                            <p><strong>Email:</strong> ${caseData.email || 'N/A'}</p>
                            <p><strong>ID Type:</strong> ${caseData.user_id_type || 'N/A'}</p>
                        </div>

                        <div class="dashboard-card">
                            <h4><i class="fas fa-map-marker-alt"></i> Location</h4>
                            <p><strong>State:</strong> ${caseData.state || 'N/A'}</p>
                            <p><strong>District:</strong> ${caseData.district || 'N/A'}</p>
                            <p><strong>Village:</strong> ${caseData.village || 'N/A'}</p>
                            <p><strong>Landmark:</strong> ${caseData.landmark || 'N/A'}</p>
                        </div>

                        <div class="dashboard-card">
                            <h4><i class="fas fa-calendar"></i> Timeline</h4>
                            <p><strong>Filed:</strong> ${utils.formatDate(caseData.created_at)}</p>
                            <p><strong>Assigned:</strong> ${caseData.assigned_at ? utils.formatDate(caseData.assigned_at) : 'Not assigned'}</p>
                            <p><strong>Last Updated:</strong> ${utils.formatDate(caseData.updated_at)}</p>
                            <p><strong>Resolved:</strong> ${caseData.resolved_at ? utils.formatDate(caseData.resolved_at) : 'Not resolved'}</p>
                        </div>
                    </div>

                    <div class="mt-3">
                        <h4><i class="fas fa-exclamation-triangle"></i> Incident Details</h4>
                        <p><strong>Category:</strong> ${caseData.category}</p>
                        <p><strong>Details:</strong> ${caseData.details}</p>
                        ${caseData.money ? `<p><strong>Money Lost:</strong> ${caseData.money}</p>` : ''}
                        ${caseData.injury ? `<p><strong>Injury/Damage:</strong> ${caseData.injury}</p>` : ''}
                    </div>

                    ${caseData.suspect_name || caseData.suspect_phone ? `
                        <div class="mt-3">
                            <h4><i class="fas fa-user-secret"></i> Suspect Information</h4>
                            ${caseData.suspect_name ? `<p><strong>Name:</strong> ${caseData.suspect_name}</p>` : ''}
                            ${caseData.suspect_phone ? `<p><strong>Phone:</strong> ${caseData.suspect_phone}</p>` : ''}
                        </div>
                    ` : ''}

                    <div class="mt-3">
                        <h4><i class="fas fa-tasks"></i> Case Management</h4>
                        <div class="form-group">
                            <label for="statusUpdate">Update Status</label>
                            <select id="statusUpdate" class="form-select">
                                <option value="pending" ${caseData.status === 'pending' ? 'selected' : ''}>Pending</option>
                                <option value="in-progress" ${caseData.status === 'in-progress' ? 'selected' : ''}>In Progress</option>
                                <option value="resolved" ${caseData.status === 'resolved' ? 'selected' : ''}>Resolved</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="remarks">Remarks</label>
                            <textarea id="remarks" class="form-control" rows="3" placeholder="Enter investigation remarks...">${caseData.remarks || ''}</textarea>
                        </div>
                        <button onclick="updateCase('${caseData.case_id}')" class="btn btn-primary">
                            <i class="fas fa-save"></i> Update Case
                        </button>
                    </div>
                </div>
            `;
        }

        async function updateCase(caseId) {
            const status = document.getElementById('statusUpdate').value;
            const remarks = document.getElementById('remarks').value;

            try {
                const result = await apiService.updateCaseStatus(caseId, status, remarks);
                if (result.case_id) {
                    utils.showAlert('Case updated successfully!', 'success');
                    loadCaseDetails(); // Refresh
                } else {
                    utils.showAlert('Failed to update case', 'error');
                }
            } catch (error) {
                console.error('Error updating case:', error);
                utils.showAlert('Error updating case', 'error');
            }
        }
    </script>
</body>
</html>
