<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security Puzzle - iReport</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-shield-alt"></i>
            <span>iReport</span>
        </div>
        <div class="nav-links">
            <a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="learning.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back to Learning</a>
            <div id="userNav"></div>
        </div>
    </nav>

    <div class="container">
        <h1 class="text-center mt-3"><i class="fas fa-puzzle-piece"></i> Cyber Security Puzzle</h1>
        <p class="text-center">Match the cyber threats with their correct prevention methods!</p>

        <div class="card mt-3">
            <h3 class="text-center">Level 1: Basic Cyber Threats</h3>
            
            <div class="puzzle-grid" id="puzzleGrid">
                <!-- Puzzle items will be generated by JavaScript -->
            </div>

            <div class="text-center mt-3">
                <button onclick="checkAnswers()" class="btn btn-primary">
                    <i class="fas fa-check"></i> Check Answers
                </button>
                <button onclick="resetPuzzle()" class="btn btn-secondary">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>

            <div id="result" class="mt-3"></div>
        </div>

        <div class="card mt-3">
            <h3><i class="fas fa-trophy"></i> Your Progress</h3>
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <h4>Current Score</h4>
                    <div class="stat-item">
                        <h3 id="currentScore">0</h3>
                        <p>Points</p>
                    </div>
                </div>
                <div class="dashboard-card">
                    <h4>Best Score</h4>
                    <div class="stat-item">
                        <h3 id="bestScore">0</h3>
                        <p>Points</p>
                    </div>
                </div>
                <div class="dashboard-card">
                    <h4>Level</h4>
                    <div class="stat-item">
                        <h3 id="currentLevel">1</h3>
                        <p>Current Level</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/script.js"></script>
    <script>
        const puzzleData = [
            { threat: "Phishing Email", solution: "Verify sender and don't click links" },
            { threat: "Weak Password", solution: "Use strong, unique passwords" },
            { threat: "Public Wi-Fi", solution: "Use VPN for secure connection" },
            { threat: "Social Engineering", solution: "Verify identity before sharing info" },
            { threat: "Malware", solution: "Install and update antivirus" },
            { threat: "Identity Theft", solution: "Monitor credit reports regularly" },
            { threat: "Fake Websites", solution: "Check for HTTPS and padlock icon" },
            { threat: "Data Breach", solution: "Use different passwords for sites" }
        ];

        let selectedItems = [];
        let score = 0;
        let bestScore = localStorage.getItem('puzzleBestScore') || 0;

        document.addEventListener('DOMContentLoaded', function() {
            authHelper.setupNavigation();
            document.getElementById('bestScore').textContent = bestScore;
            initializePuzzle();
        });

        function initializePuzzle() {
            const grid = document.getElementById('puzzleGrid');
            const shuffledData = [...puzzleData].sort(() => Math.random() - 0.5);
            
            // Double the array to create pairs
            const puzzleItems = [];
            shuffledData.forEach(item => {
                puzzleItems.push({ type: 'threat', text: item.threat, pair: item.solution });
                puzzleItems.push({ type: 'solution', text: item.solution, pair: item.threat });
            });
            
            // Shuffle the pairs
            puzzleItems.sort(() => Math.random() - 0.5);
            
            grid.innerHTML = puzzleItems.map((item, index) => `
                <div class="puzzle-item" data-type="${item.type}" data-pair="${item.pair}" onclick="selectItem(${index})">
                    ${item.text}
                </div>
            `).join('');
        }

        function selectItem(index) {
            const items = document.querySelectorAll('.puzzle-item');
            const item = items[index];
            
            if (selectedItems.length < 2 && !item.classList.contains('selected')) {
                item.classList.add('selected');
                selectedItems.push({
                    element: item,
                    type: item.dataset.type,
                    pair: item.dataset.pair
                });
                
                if (selectedItems.length === 2) {
                    checkMatch();
                }
            }
        }

        function checkMatch() {
            const [item1, item2] = selectedItems;
            
            if (item1.type !== item2.type && item1.pair === item2.text) {
                // Correct match
                item1.element.style.background = 'var(--success)';
                item2.element.style.background = 'var(--success)';
                item1.element.classList.add('matched');
                item2.element.classList.add('matched');
                score += 10;
                document.getElementById('currentScore').textContent = score;
                
                // Check if puzzle is complete
                if (document.querySelectorAll('.matched').length === puzzleData.length * 2) {
                    setTimeout(() => {
                        document.getElementById('result').innerHTML = `
                            <div class="alert alert-success text-center">
                                <h4><i class="fas fa-trophy"></i> Puzzle Complete!</h4>
                                <p>Your score: ${score} points</p>
                                ${score > bestScore ? '<p>New high score!</p>' : ''}
                            </div>
                        `;
                        
                        if (score > bestScore) {
                            bestScore = score;
                            localStorage.setItem('puzzleBestScore', bestScore);
                            document.getElementById('bestScore').textContent = bestScore;
                        }
                    }, 500);
                }
            } else {
                // Incorrect match
                item1.element.style.background = 'var(--danger)';
                item2.element.style.background = 'var(--danger)';
                
                setTimeout(() => {
                    item1.element.classList.remove('selected');
                    item2.element.classList.remove('selected');
                    item1.element.style.background = '';
                    item2.element.style.background = '';
                }, 1000);
            }
            
            setTimeout(() => {
                selectedItems = [];
            }, 1000);
        }

        function checkAnswers() {
            const matchedPairs = document.querySelectorAll('.matched').length / 2;
            alert(`You have matched ${matchedPairs} out of ${puzzleData.length} pairs correctly!`);
        }

        function resetPuzzle() {
            selectedItems = [];
            score = 0;
            document.getElementById('currentScore').textContent = '0';
            document.getElementById('result').innerHTML = '';
            initializePuzzle();
        }
    </script>
</body>
</html>
