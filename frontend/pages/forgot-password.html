<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - iReport</title>
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Reset Password</h1>
                <p>Enter your email to receive reset instructions</p>
            </div>
            
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required 
                           placeholder="Enter your registered email">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Send Reset Instructions</button>
            </form>
            
            <div class="auth-footer">
                <p>Remember your password? <a href="login.html">Back to login</a></p>
            </div>
        </div>
    </div>

    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/auth.js"></script>
    
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            
            if (!email) {
                alert('Please enter your email address');
                return;
            }

            try {
                // Show loading
                const button = this.querySelector('button[type="submit"]');
                button.disabled = true;
                button.textContent = 'Sending...';
                
                const response = await authAPI.forgotPassword(email);
                
                if (response.message) {
                    alert('Password reset instructions sent to your email!');
                    window.location.href = 'login.html';
                }
            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                const button = document.querySelector('button[type="submit"]');
                button.disabled = false;
                button.textContent = 'Send Reset Instructions';
            }
        });

        // Check if email is provided in URL
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email');
        if (email) {
            document.getElementById('email').value = decodeURIComponent(email);
        }
    </script>
</body>
</html>
