<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check Suspect - iReport</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    :root {
      --bg-dark: url('https://images.unsplash.com/photo-1510511459019-5dda7724fd87?auto=format&fit=crop&w=1920&q=80');
      --text-color: #fff;
      --card-bg: rgba(255, 255, 255, 0.1);
      --inner-card-bg: rgba(255, 255, 255, 0.2);
      --shadow-color: rgba(0, 0, 0, 0.3);
      --btn-bg: #00c853;
    }

    body.light-mode {
      --bg-dark: url('https://images.unsplash.com/photo-1508780709619-79562169bc64?auto=format&fit=crop&w=1920&q=80');
      --text-color: #111;
      --card-bg: rgba(255, 255, 255, 0.7);
      --inner-card-bg: rgba(255, 255, 255, 0.8);
      --shadow-color: rgba(0, 0, 0, 0.1);
      --btn-bg: #0078d7;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      color: var(--text-color);
      background: var(--bg-dark) no-repeat center center/cover;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
    }

    .bg-fixed {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg-dark) no-repeat center center/cover;
      z-index: -1;
      pointer-events: none;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      cursor: pointer;
      background: transparent;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }
    .theme-toggle:hover {
      background: var(--inner-card-bg);
    }

    .main-container {
      background: var(--card-bg);
      position: fixed;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 8px 32px var(--shadow-color);
      backdrop-filter: blur(15px);
      text-align: center;
      width: 80%;
      max-width: 900px;
      z-index: 1;
    }

    .main-container h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .main-container p {
      margin-bottom: 30px;
      font-size: 1rem;
      opacity: 0.9;
    }

    .inner-box {
      background: var(--inner-card-bg);
      padding: 40px 20px;
      border-radius: 15px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      justify-items: center;
      margin-bottom: 30px;
      transition: background 0.3s ease;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 20px;
      width: 100%;
    }
    .form-group label {
      margin-bottom: 5px;
      font-weight: 500;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
    }

    .captcha-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .captcha-code {
      padding: 10px 15px;
      background: rgba(255,255,255,0.3);
      border-radius: 8px;
      font-weight: bold;
      letter-spacing: 2px;
      user-select: none;
    }

    .submit-btn {
      padding: 12px 25px;
      background: var(--btn-bg);
      border: none;
      color: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }
    .submit-btn:hover {
      background: #00a544;
    }

    .result-box {
      margin-top: 20px;
      padding: 20px;
      border-radius: 12px;
      background: var(--inner-card-bg);
      font-weight: 500;
    }
  </style>
</head>
<body class="dark-mode">

  <div class="bg-fixed"></div>

  <div class="theme-toggle" onclick="toggleTheme()">
    <i class="fas fa-adjust"></i>
  </div>

  <div class="main-container">
    <h1>Check Suspect</h1>
    <p>Enter suspect ID and type the CAPTCHA correctly</p>

    <div class="inner-box">
      <div style="width: 100%;">
        <div class="form-group">
          <label for="suspectId">Suspect ID:</label>
          <input type="text" id="suspectId" placeholder="Enter suspect ID" />
        </div>

        <div class="form-group captcha-box">
          <div class="captcha-code" id="captchaCode">ABC123</div>
          <button type="button" onclick="generateCaptcha()">↻</button>
        </div>
        <div class="form-group">
          <label for="captchaInput">Type the CAPTCHA:</label>
          <input type="text" id="captchaInput" placeholder="Enter CAPTCHA here" />
        </div>

        <button class="submit-btn" onclick="checkSuspect()">Check Suspect</button>

        <div id="result" class="result-box" style="display:none;"></div>
      </div>
    </div>
  </div>

  <script>
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      document.body.classList.toggle('dark-mode');
    }

    function generateCaptcha() {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let captcha = '';
      for(let i=0; i<6; i++) {
        captcha += chars.charAt(Math.floor(Math.random()*chars.length));
      }
      document.getElementById('captchaCode').innerText = captcha;
    }
    generateCaptcha();

    async function checkSuspect() {
      const suspectId = document.getElementById('suspectId').value.trim();
      const captchaInput = document.getElementById('captchaInput').value.trim();
      const captchaCode = document.getElementById('captchaCode').innerText;

      if (!suspectId) {
        alert("Please enter suspect ID");
        return;
      }

      if (captchaInput !== captchaCode) {
        alert("Incorrect CAPTCHA! Try again.");
        generateCaptcha();
        document.getElementById('captchaInput').value = '';
        return;
      }

      try {
        const response = await fetch(`http://127.0.0.1:8000/check_suspect/?suspect_id=${suspectId}`);
        if (!response.ok) throw new Error("Suspect not found");
        const data = await response.json();

        const resultBox = document.getElementById('result');
        resultBox.style.display = "block";
        resultBox.innerHTML = `
          <p><strong>Suspect ID:</strong> ${data.suspect_id}</p>
          <p><strong>Name:</strong> ${data.name}</p>
          <p><strong>Status:</strong> ${data.status}</p>
          <p><strong>Remarks:</strong> ${data.remarks}</p>
        `;
      } catch (err) {
        alert("Error fetching suspect: " + err.message);
      }
    }
  </script>
</body>
</html>
