<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Details - iReport</title>
    <link rel="stylesheet" href="../assets/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <i class="fas fa-shield-alt"></i>
            <span>iReport</span>
        </div>
        <div class="nav-links">
            <a href="../index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
            <a href="user.html" class="nav-link"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            <div id="userNav"></div>
        </div>
    </nav>

    <div class="container">
        <div id="caseDetails">
            <div class="spinner"></div>
        </div>
    </div>

    <script src="../assets/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!authHelper.redirectIfNotLoggedIn()) return;
            authHelper.setupNavigation();
            loadCaseDetails();
        });

        async function loadCaseDetails() {
            const urlParams = new URLSearchParams(window.location.search);
            const caseId = urlParams.get('case_id');
            
            if (!caseId) {
                document.getElementById('caseDetails').innerHTML = `
                    <div class="alert alert-error">
                        No case ID provided.
                    </div>
                `;
                return;
            }

            try {
                const caseData = await apiService.trackComplaint(caseId);
                displayCaseDetails(caseData);
            } catch (error) {
                console.error('Error loading case details:', error);
                document.getElementById('caseDetails').innerHTML = `
                    <div class="alert alert-error">
                        Error loading case details. Please try again.
                    </div>
                `;
            }
        }

        function displayCaseDetails(caseData) {
            document.getElementById('caseDetails').innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h2><i class="fas fa-file-alt"></i> Case: ${caseData.case_id}</h2>
                        <div>
                            <span class="badge ${utils.getStatusBadge(caseData.status)}">${caseData.status}</span>
                            <span class="badge ${utils.getStatusBadge(caseData.priority)}">${caseData.priority}</span>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        <div class="dashboard-card">
                            <h4><i class="fas fa-info-circle"></i> Case Information</h4>
                            <p><strong>Category:</strong> ${caseData.category}</p>
                            <p><strong>Status:</strong> <span class="badge ${utils.getStatusBadge(caseData.status)}">${caseData.status}</span></p>
                            <p><strong>Priority:</strong> <span class="badge ${utils.getStatusBadge(caseData.priority)}">${caseData.priority}</span></p>
                            <p><strong>Filed On:</strong> ${utils.formatDate(caseData.created_at)}</p>
                        </div>

                        <div class="dashboard-card">
                            <h4><i class="fas fa-user-shield"></i> Assignment Details</h4>
                            <p><strong>Assigned Officer:</strong> ${caseData.assigned_officer || 'Not assigned yet'}</p>
                            <p><strong>Police Station:</strong> ${caseData.station || 'N/A'}</p>
                            <p><strong>Assigned On:</strong> ${caseData.assigned_at ? utils.formatDate(caseData.assigned_at) : 'Not assigned'}</p>
                        </div>

                        <div class="dashboard-card">
                            <h4><i class="fas fa-chart-line"></i> Progress</h4>
                            <p><strong>Last Updated:</strong> ${utils.formatDate(caseData.updated_at)}</p>
                            <p><strong>Resolution Date:</strong> ${caseData.resolved_at ? utils.formatDate(caseData.resolved_at) : 'Not resolved'}</p>
                            <p><strong>Severity Score:</strong> ${caseData.severity_score || 'N/A'}</p>
                        </div>
                    </div>

                    <div class="mt-3">
                        <h4><i class="fas fa-exclamation-triangle"></i> Incident Details</h4>
                        <p><strong>Description:</strong> ${caseData.details}</p>
                        ${caseData.money ? `<p><strong>Financial Loss:</strong> ${caseData.money}</p>` : ''}
                        ${caseData.injury ? `<p><strong>Injury/Damage:</strong> ${caseData.injury}</p>` : ''}
                    </div>

                    ${caseData.remarks ? `
                        <div class="mt-3">
                            <h4><i class="fas fa-comment"></i> Officer Remarks</h4>
                            <div class="alert alert-info">
                                <p>${caseData.remarks}</p>
                                <small>Last updated: ${utils.formatDate(caseData.updated_at)}</small>
                            </div>
                        </div>
                    ` : ''}

                    <div class="mt-3">
                        <h4><i class="fas fa-question-circle"></i> Need Help?</h4>
                        <p>If you have additional information or need to update your complaint, please contact support.</p>
                        <div class="hero-buttons">
                            <a href="track.html?case_id=${caseData.case_id}" class="btn btn-primary">
                                <i class="fas fa-sync-alt"></i> Refresh Status
                            </a>
                            <a href="../pages/awareness.html" class="btn btn-secondary">
                                <i class="fas fa-lightbulb"></i> Learn More
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
