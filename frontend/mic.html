<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Crime Complaint Form with Mic (Web Speech API)</title>
<style>
body { font-family: Arial; background: #111; color: white; padding: 20px; }
.container { max-width: 800px; margin: auto; }
textarea { width: 100%; height: 150px; padding: 10px; }
button { padding: 10px; margin-top: 10px; cursor: pointer; }
#mic-button { background: orange; color: white; }
</style>
</head>
<body>
<div class="container">
<h2>Cyber Crime Complaint Form</h2>
<label>Description (Speak in your language)</label>
<textarea id="details" placeholder="Recording will appear here..."></textarea><br>
<button id="mic-button">🎤 Speak </button>
</div>

<script>
if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert("Sorry, your browser doesn't support speech recognition.");
}

const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.continuous = true;
recognition.interimResults = true;
recognition.lang = 'en-US'; 
let recording = false;

document.getElementById("mic-button").onclick = function() {
    if (!recording) {
        recording = true;
        this.textContent = "🛑 Stop Recording";
        recognition.start();
    } else {
        recording = false;
        this.textContent = "🎤 Start Recording";
        recognition.stop();
    }
};

recognition.onresult = function(event) {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
    }
    document.getElementById("details").value = transcript;
};

recognition.onerror = function(event) {
    console.error("Speech recognition error:", event.error);
};
</script>
</body>
</html>
