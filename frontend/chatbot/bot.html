<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iReport Chatbot</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<div class="container">
  <h2>Cybercrime Chatbot</h2>
  <div id="chatbox" style="border:1px solid #ccc; height:300px; overflow-y:auto; padding:10px;"></div>
  <input type="text" id="userInput" placeholder="Ask me something..." />
  <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
  const input = document.getElementById('userInput');
  const message = input.value;
  if (!message) return;

  const chatbox = document.getElementById('chatbox');
  chatbox.innerHTML += `<p><strong>You:</strong> ${message}</p>`;

  // Simple mock response for demo
  let response = "I'm here to help! For cybercrime reports, please submit a complaint.";

  // Future: connect to AI backend endpoint
  /*
  const res = await fetch('http://127.0.0.1:8000/chatbot?message=' + encodeURIComponent(message));
  const data = await res.json();
  response = data.reply;
  */

  chatbox.innerHTML += `<p><strong>Bot:</strong> ${response}</p>`;
  input.value = '';
  chatbox.scrollTop = chatbox.scrollHeight;
}
</script>
</body>
</html>
